state.dict = state.dict || {};
function dictTokens(text){
  // Matnni so'zlarga bo'ladi: har bir so'z uchun asl ko'rinish (raw) va taqqoslash shakli (norm)
  return String(text||'').replace(/[\u2018\u2019\u02BC]/g,"'").split(/\s+/).map(raw=>{
    const norm = raw.toLowerCase().replace(/^[^a-z0-9\u0400-\u04ff]+|[^a-z0-9\u0400-\u04ff]+$/gi,'');
    return { raw, norm };
  }).filter(t=>t.norm.length>0);
}
function dictCompare(typedText, scriptText){
  const T = dictTokens(typedText), S = dictTokens(scriptText);
  const n = T.length, m = S.length;
  // LCS jadvali
  const W = m+1;
  const dp = new Uint16Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i*W+j] = (T[i].norm===S[j].norm) ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
    }
  }
  const ops = []; // {t:'ok'|'bad'|'miss', raw}
  let i=0, j=0, runT=[], runS=0;
  const flush = ()=>{
    runT.forEach(w=>ops.push({t:'bad', raw:w}));
    for(let k=0;k<runS-runT.length;k++) ops.push({t:'miss'});
    runT=[]; runS=0;
  };
  while(i<n && j<m){
    if(T[i].norm===S[j].norm){ flush(); ops.push({t:'ok', raw:T[i].raw}); i++; j++; }
    else if(dp[(i+1)*W+j] >= dp[i*W+j+1]){ runT.push(T[i].raw); i++; }
    else { runS++; j++; }
  }
  while(i<n){ runT.push(T[i].raw); i++; }
  while(j<m){ runS++; j++; }
  flush();
  const ok = ops.filter(o=>o.t==='ok').length;
  const bad = ops.filter(o=>o.t==='bad').length;
  const miss = ops.filter(o=>o.t==='miss').length;
  return { ops, ok, bad, miss, total:m, pct: m ? Math.round(ok/m*100) : 0 };
}

    }

  wrap.appendChild(list);
  return wrap;

/* ============ HTML mashqdan natijani avtomatik olish ============ */
// HTML test ichida natija chiqishi bilan (masalan "Score: 32/40") uni o'zimiz aniqlab saqlaymiz.
// Aniqroq usul: HTML fayl oxirida  parent.postMessage({type:'ielts-result', correct:32, total:40}, '*')  deb yuborishi mumkin.
function parseScoreFromText(txt, expectedTotal){
  if(!txt) return null;
  txt = txt.replace(/\s+/g,' ');
  const KW = "(?:score|result|results|correct|natija|natijangiz|ball|to['’`]?g['’`]?ri|you got|you scored|raw score|marks?|правильн\\w*|результат|балл\\w*)";
  const SEP = "(?:\\/|out of|of|dan|из)";
  const re1 = new RegExp(KW+"[^0-9]{0,30}?(\\d{1,2})\\s*"+SEP+"\\s*(\\d{1,2})\\b","gi");
  const re2 = new RegExp("\\b(\\d{1,2})\\s*"+SEP+"\\s*(\\d{1,2})\\s*(?:"+KW+"|correct|questions|savol)","gi");
  let best = null;
  [re1, re2].forEach(re=>{
    let m;
    while((m = re.exec(txt))){
      const c = +m[1], t = +m[2];
      if(t<5 || t>60 || c>t) continue;
      if(expectedTotal && t!==expectedTotal && t<10) continue;
      best = { correct:c, total:t };
    }
  });
  return best;
}
function installResultWatcher(frame, expectedTotal, onResult){
  let finished = false, pending = null, lastFired = null, stopped = false, iv = null;
  const FIN = /submit|finish|check|grade|score|result|done|complete|end\b|yakun|tugat|tekshir|topshir|natija|yubor|заверш|провер|результат|готово/i;
  const onMsg = (ev)=>{
    try{
      if(!frame.contentWindow || ev.source!==frame.contentWindow) return;
      const d = ev.data;
      if(d && d.type==='ielts-result'){
        const t = Number(d.total) || expectedTotal || 40, c = Number(d.correct);
        if(isFinite(c) && c>=0 && c<=t){ const key = c+'/'+t; if(key!==lastFired){ lastFired = key; onResult(c, t); } }
      }
    }catch(e){}
  };
  window.addEventListener('message', onMsg);
  const hook = ()=>{
    try{
      const doc = frame.contentDocument;
      if(!doc || doc.__ieltsHooked) return;
      doc.__ieltsHooked = true;
      doc.addEventListener('click', ev=>{
        const t = ev.target && ev.target.closest ? ev.target.closest('button, a, input[type=button], input[type=submit], [role=button]') : null;
        if(!t) return;
        const label = (t.innerText||t.value||'')+' '+(t.id||'')+' '+((t.className && t.className.toString) ? t.className.toString() : '');
        if(FIN.test(label)) finished = true;
      }, true);
    }catch(e){}
  };
  const scan = ()=>{
    if(stopped) return;
    if(!frame.isConnected){ stopped = true; clearInterval(iv); window.removeEventListener('message', onMsg); return; }
    hook();
    if(!finished) return;
    let txt = '';
    try{ const doc = frame.contentDocument; txt = (doc && doc.body) ? doc.body.innerText : ''; }catch(e){ return; }
    const r = parseScoreFromText(txt, expectedTotal);
    if(!r){ pending = null; return; }
    const key = r.correct+'/'+r.total;
    if(!pending || pending.key!==key){ pending = { key, n:1 }; return; }
    pending.n++;
    if(pending.n>=2 && key!==lastFired){ lastFired = key; onResult(r.correct, r.total); }
  };
  iv = setInterval(scan, 1200);
}

/* ============ HTML ichidagi audio havolalari ============ */
const MEDIA_REF_RE = /(["'`])((?!https?:|data:|blob:|\/\/)[^"'`<>\n]{1,200}\.(?:mp3|wav|m4a|aac|ogg|oga|opus|flac|webm|mp4|mpeg))\1/gi;
function findRelativeMediaRefs(text){
  const refs = [];
  let m; MEDIA_REF_RE.lastIndex = 0;
  while((m = MEDIA_REF_RE.exec(text))){ if(!refs.includes(m[2])) refs.push(m[2]); }
  return refs;
}
// HTML bilan birga tanlangan audio fayllarni yuklab, HTML ichidagi nomlarini ularning manziliga almashtiradi
async function rewriteMediaRefs(text, mediaFiles){
  const byName = {};
  mediaFiles.forEach(f=>{ byName[f.name.toLowerCase()] = f; });
  const urls = {};
  for(const ref of findRelativeMediaRefs(text)){
    const base = ref.split(/[\\/]/).pop().split('?')[0].toLowerCase();
    const f = byName[base];
    if(!f) continue;
    if(f.size > 45*1024*1024){ toast(f.name+' 45 MB dan katta — siqib, qayta yuklang.'); continue; }
    if(!urls[base]){
      const res = await uploadFile(f, {type: f.type || 'audio/mpeg'});
      if(res) urls[base] = res.url;
    }
    if(urls[base]){
      ['"',"'",'`'].forEach(q=>{ text = text.split(q+ref+q).join(q+urls[base]+q); });
    }
  }
  return text;
}

        let media = [];

          if(m.tagName==='VIDEO') return;

            const r = m.getBoundingClientRect();
            usable = !!m.controls && cs.display!=='none' && cs.visibility!=='hidden' && r.width>40;
          }catch(e){}
          if(usable) return;   // faylning o'z pleyeri ko'rinib turibdi
          const s = m.currentSrc || m.getAttribute('src') || '';

        });
        if(proxies.length){
          audioWrap.appendChild(el(`<label>Audio yozuv</label>`));

            a.addEventListener('play', ()=>{ try{ m.pause(); }catch(e){} });
            m.addEventListener('play', ()=>{ try{ a.pause(); }catch(e){} });
            aw.appendChild(a);
            audioWrap.appendChild(aw);

        }
        // Audio manzili ishlamayotgan bo'lsa — sababini ko'rsatamiz
        const checkBroken = ()=>{
          if(!audioWrap.isConnected) return;
          audioWrap.querySelectorAll('.audio-warn').forEach(n=>n.remove());
          const broken = media.filter(m=>m.tagName==='AUDIO' && (m.error || (m.networkState===3 && (m.currentSrc || m.getAttribute('src')))));

        };
        setTimeout(checkBroken, 1500);
        setTimeout(checkBroken, 5000);
      }
      frame.onload = ()=>{ setTimeout(extractAndShowAudio, 400); applyZoom(); };
      frame.srcdoc = htmlText;
      if((ex.section==='reading' || ex.section==='listening')){
        installResultWatcher(frame, ex.totalQuestions || null, (c, t)=>{ if(rlBlock) rlBlock.submitResult(c, t); });
      }
      // Safety fallback in case onload never fires
      setTimeout(()=>{ if(audioWrap.contains(loadingMsg)) extractAndShowAudio(); }, 3000);
    }).catch(()=>{
      audioWrap.innerHTML='';
      audioWrap.appendChild(el(`<div class="empty">Faylni yuklab bo'lmadi. Qayta urinib ko'ring.</div>`));
    });
  } else if(ex.assetUrl){
    if(!isImgAsset && (ex.section==='listening' || (ex.assetType||'').startsWith('audio') || (ex.assetType||'').startsWith('video'))){
      const aw = el(`<div class="audio-wrap"><label>Audio yozuv</label><audio controls src="${ex.assetUrl}"></audio></div>`);
      card.appendChild(aw);
    } else if(isImgAsset){
      card.appendChild(el(`<label>${ex.section==='writing' ? 'Task 1 rasmi (diagramma/grafik)' : 'Rasm'}</label>`));
      const imgHolder = el(`<div style="margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--card-solid);padding:10px;text-align:center;"></div>`);
      const taskImg = document.createElement('img');
      taskImg.alt = 'Task rasmi';
      taskImg.style.cssText = 'max-width:100%;height:auto;border-radius:8px;display:block;margin:0 auto;cursor:zoom-in;';
      taskImg.onclick = ()=>showImageOverlay(taskImg.src);
      let imgTries = 0;
      const imgFail = ()=>{ imgHolder.innerHTML = '<div style="padding:18px 8px;font-size:13px;color:var(--ink-soft);">Rasmni ochib bo\'lmadi. Admin: Supabase → Storage → "assets" bucket\'ini <b>Public</b> qiling yoki rasmni qayta yuklang.</div>'; };
      taskImg.onerror = async ()=>{
        if(imgTries++ > 0){ imgFail(); return; }
        try{
          if(state.sb && ex.assetId){
            const bucket = state.sb.storage.from('assets');
            const dl = await bucket.download(ex.assetId);
            if(dl && !dl.error && dl.data){ taskImg.src = URL.createObjectURL(dl.data); return; }
            const sg = await bucket.createSignedUrl(ex.assetId, 3600);
            if(sg && sg.data && sg.data.signedUrl){ taskImg.src = sg.data.signedUrl; return; }
          }
        }catch(e){}
        imgFail();
      };
      taskImg.src = ex.assetUrl;
      imgHolder.appendChild(taskImg);
      card.appendChild(imgHolder);
    } else {
      const link = el(`<a class="file-link" href="${ex.assetUrl}" target="_blank" rel="noopener">📄 Faylni ochish</a>`);
      card.appendChild(link);
    }
  }

  if(ex.section==='writing' && ex.promptText){
    card.appendChild(el(`<div class="card" style="padding:14px 16px;margin-top:12px;background:var(--paper);"><label style="margin-bottom:4px;">Mavzu</label><div style="font-size:14.5px;line-height:1.6;">${escapeHtml(ex.promptText)}</div></div>`));
  }

  card.appendChild(el(`<div class="divider"></div>`));

  if(ex.section==='writing'){
    card.appendChild(WritingSubmitBlock(ex));
  } else if(ex.section!=='full'){
    rlBlock = ReadingListeningSubmitBlock(ex);
    card.appendChild(rlBlock);
  }

  wrap.appendChild(card);

  // Past attempts for this exercise
  const pastHolder = document.createElement('div');
  wrap.appendChild(pastHolder);
  const renderPast = ()=>{
  pastHolder.innerHTML = '';
  const past = (state.results.attempts||[]).filter(a=>a.examId===ex.id);
  if(past.length){
    const histCard = document.createElement('div');
    histCard.className='card';
    histCard.style.padding='16px 20px';
    histCard.style.marginTop='16px';
    histCard.appendChild(el(`<h3 style="margin:0 0 8px;font-size:14.5px;">Oldingi urinishlar</h3>`));
    const tbl = document.createElement('table');
    tbl.className='hist';
    tbl.innerHTML = `<tr><th>Sana</th><th>Natija</th></tr>` + past.map(a=>`
      <tr><td>${new Date(a.date).toLocaleDateString('uz-UZ')}</td><td>${a.band!=null? 'Band '+a.band : (a.correct+'/'+a.total)}${a.timeSec ? ' · ⏱ '+fmtDur(a.timeSec) : ''}</td></tr>
    `).join('');
    histCard.appendChild(tbl);
    pastHolder.appendChild(histCard);
  }
  };
  renderPast();
  if(rlBlock) rlBlock.onSaved = renderPast;

  return wrap;
}

async function aiAnalyzeReadingListening(chatId, section, examTitle, correct, total, band, onUpdate, timeInfo){
  if(!state.sample){ toast('AI xizmati mavjud emas'); return; }
  if(!(await chargeAiAnalysis())){ state.aiState[chatId] = { loading:false, failed:true, text:AI_DECLINE_TEXT }; if(onUpdate) onUpdate(); return; }
  state.aiState[chatId] = { loading:true, text:'' };
  if(onUpdate) onUpdate();
  try{
    const secLabel = section==='reading' ? 'Reading' : 'Listening';
    const instruction = `Siz tajribali IELTS ${secLabel} o'qituvchisisiz. Talaba "${examTitle}" mashqini bajardi: ${total} savoldan ${correct} tasini to'g'ri topdi (taxminiy band: ${band}).${aiTimeLine(timeInfo)}
O'zbek tilida qisqa, aniq tahlil bering:
1) Bu natija shu bandda odatda qanday xatolar ko'p uchrashini tushuntiring (masalan: vaqt yetishmasligi, kalit so'zlarni topa olmaslik, parafrazani tanimaslik, distraktorlarga aldanish va h.k. — ${secLabel} uchun tegishlisini tanlang).
2) Keyingi safar bandni oshirish uchun 3 ta aniq, amaliy tavsiya bering (masalan qanday strategiya bilan mashq qilish kerak).
3) Bitta qisqa kunlik mashq tavsiyasi bilan yakunlang.
Halol va konkret yozing, umumiy gaplardan saqlaning.`;
    const res = await state.sample(instruction, { onText:({text})=>{ state.aiState[chatId] = {loading:true, text}; if(onUpdate) onUpdate(); }, modelTier:'default' });
    if(!res || res.error || !res.text){
      await refundAiAnalysis();
      state.aiState[chatId] = { loading:false, failed:true, text: (res && res.text) || 'AI xizmatida xatolik yuz berdi. Birozdan so\'ng qayta urinib ko\'ring.' };
    } else {
      state.aiState[chatId] = { loading:false, text: res.text };
    }
    if(onUpdate) onUpdate();
  }catch(e){
    await refundAiAnalysis();
    state.aiState[chatId] = { loading:false, failed:true, text: 'AI tahlilida xatolik yuz berdi. Birozdan so\'ng qayta urinib ko\'ring.' };
    if(onUpdate) onUpdate();
  }
}

function ReadingListeningSubmitBlock(ex){
  const box = document.createElement('div');
  const total = ex.totalQuestions || 40;
  const isHtml = ex.contentKind==='html' && !!ex.assetUrl;
  const chatId = 'rl-'+ex.id;
  let attemptId = uid(), lastKey = null, lastSaveAt = 0, lastBand = null, lastCorrect = null, lastTotal = null, autoMode = false;

  if(isHtml){
    box.appendChild(el(`<div class="card" id="rl-auto" style="padding:12px 16px;margin-bottom:12px;background:var(--paper);font-size:13.5px;line-height:1.5;">⏳ Testni yakunlang — natijangiz avtomatik aniqlanadi va saqlanadi.</div>`));
  }
  // HTML mashqlarda qo'lda kiritish faqat zaxira variant sifatida yig'ilgan holda turadi
  const holder = isHtml
    ? el(`<details style="margin-bottom:10px;"><summary style="cursor:pointer;font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Natija avtomatik chiqmadimi? Qo'lda kiriting</summary></details>`)
    : document.createElement('div');
  holder.appendChild(el(`
    <div style="display:contents">
    <label>Natijangizni kiriting</label>
    <div class="row2">
      <div class="field"><label>To'g'ri javoblar soni</label><input type="number" id="rl-correct" min="0" max="${total}" placeholder="masalan 32"></div>
      <div class="field"><label>Jami savollar soni</label><input type="number" id="rl-total" value="${total}"></div>
    </div>
    </div>
  `));
  holder.appendChild(aiHintEl());
  const btn = el(`<button class="btn btn-primary">Natijani saqlash</button>`);
  holder.appendChild(btn);
  box.appendChild(holder);
  const out = document.createElement('div');
  box.appendChild(out);

  function runAi(){
    const tm = stopExTimer(ex.id);
    const timeInfo = tm ? { sec: tm.sec, std: exStdMinutes(ex) } : null;
    aiAnalyzeReadingListening(chatId, ex.section, ex.title, lastCorrect, lastTotal, lastBand, ()=>renderOut(lastBand), timeInfo);
  }
  function renderOut(band){
    out.innerHTML='';
    out.appendChild(el(`<div class="band-pill" style="margin-top:12px;"><b>${band}</b><span>band</span></div>`));
    const st = state.aiState[chatId];
    if(st){
      if(st.loading && !st.text){
        out.appendChild(el(`<div class="thinking" style="margin-top:14px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span> AI tahlil qilmoqda...</div>`));
      } else {
        out.appendChild(el(`<div class="ai-box" style="margin-top:14px;">${escapeHtml(st.text)}</div>`));
        if(st.failed){
          const rb = el(`<button class="btn btn-sm" style="margin-top:10px;">🔄 Qayta urinish</button>`);
          rb.onclick = runAi;
          out.appendChild(rb);
        }
      }
    } else if(autoMode){
      // AI tahlil coin sarflashi mumkin — shuning uchun avtomatik emas, tugma bilan
      const ab = el(`<button class="btn btn-sm" style="margin-top:12px;">🤖 AI tahlilini olish</button>`);
      ab.onclick = runAi;
      out.appendChild(ab);
    }
  }
  async function submit(correct, total2, auto){
    const key = correct+'/'+total2;
    if(auto){
      if(key===lastKey) return;
      // Bir necha daqiqadan keyin boshqa natija chiqsa — bu yangi urinish
      if(lastKey && Date.now()-lastSaveAt > 180000){ attemptId = uid(); delete state.aiState[chatId]; }
    }
    autoMode = !!auto;
    const band = bandFromScore(correct, total2);
    const tm = stopExTimer(ex.id);
    const timeInfo = tm ? { sec: tm.sec, std: exStdMinutes(ex) } : null;
    lastKey = key; lastSaveAt = Date.now(); lastBand = band; lastCorrect = correct; lastTotal = total2;
    const c1 = box.querySelector('#rl-correct'), c2 = box.querySelector('#rl-total');
    if(c1) c1.value = correct; if(c2) c2.value = total2;
    const stEl = box.querySelector('#rl-auto');
    if(auto && stEl) stEl.textContent = '✅ Natija avtomatik aniqlandi: '+correct+'/'+total2+' — Band '+band+' (saqlandi)';
    renderOut(band);
    toast(tm ? 'Natija saqlandi — vaqt: '+fmtDur(tm.sec) : 'Natija saqlandi');
    await saveResultAttempt({
      id: attemptId, section: ex.section, subtype: ex.subtype, examId: ex.id, examTitle: ex.title,
      isMock: !!ex.mockId, mockId: ex.mockId, correct, total: total2, band, timeSec: tm ? tm.sec : null, date: Date.now()
    }, { silent:true });
    if(box.onSaved) box.onSaved();
    if(!auto) aiAnalyzeReadingListening(chatId, ex.section, ex.title, correct, total2, band, ()=>renderOut(band), timeInfo);
  }
  btn.onclick=()=>{
    const correct = parseInt(box.querySelector('#rl-correct').value);
    const total2 = parseInt(box.querySelector('#rl-total').value) || total;
    if(isNaN(correct) || correct<0 || correct>total2){ toast("To'g'ri qiymat kiriting"); return; }
    submit(correct, total2, false);
  };
  box.submitResult = (c, t)=>submit(c, t, true);
  return box;
}

  }

  const card = document.createElement('div');

  card.style.padding='20px 22px';

    card.appendChild(el(`<h3 style="margin:0 0 14px;font-size:16px;">${escapeHtml(_gt||"To'liq Speaking test")}</h3>`));
    ['part1','part2','part3'].forEach(p=>{
      const q = groupParts[p];
      if(!q) return;
      grpBox.appendChild(el(`
        <div style="margin-bottom:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;">
          <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;">${SUBTYPE_LABEL[p]}</div>
          <div style="font-size:14px;">${escapeHtml(q.text)}</div>
        </div>
      `));
    });
    grpBox.appendChild(el(`<div style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 14px;">Javob berayotgan qismning savolini pastdagi maydonga joylashtiring (masalan, avval Part 1 bilan boshlang), so'ng gapiring. Har bir qismni alohida-alohida shu tartibda bajaring.</div>`));
  }

  grpBox.style.display='none';
  card.appendChild(grpBox);
  const topicVal = d.isGroup ? (groupParts.part1 ? groupParts.part1.text : '') : topicText;
  const field = el(`
    <div class="field">
      <label>Savol</label>
      <div style="display:flex;gap:8px;">
        <textarea id="sp-topic" rows="2">${escapeHtml(topicVal)}</textarea>
        <button class="btn btn-ghost" id="sp-listen" title="Ovozda eshitish">🔊</button>
      </div>
    </div>
  `);
  card.appendChild(field);
  const topicInput = card.querySelector('#sp-topic');
  card.querySelector('#sp-listen').onclick=()=>{
    const t = topicInput.value.trim();
    if(!t){ toast('Avval savol matni bo\'lsin'); return; }
    speakText(t);
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechSupported = !!SR;
  let liveTranscript = '';
  let recognizing = false;
  let recognizer = null;

  const answerArea = document.createElement('div');
  answerArea.style.marginTop = '6px';

  function renderAnswerArea(){
    answerArea.innerHTML = '';
    if(speechSupported){
      answerArea.appendChild(el(`
        <div class="field">
          <label>Javobingiz (gapiring)</label>
          <div class="card" id="sp-transcript" style="padding:14px 16px;min-height:70px;font-size:14px;line-height:1.6;color:${liveTranscript?'var(--ink)':'var(--ink-soft)'};">${liveTranscript ? escapeHtml(liveTranscript) : 'Mikrofon tugmasini bosib gapiring — matn shu yerda paydo bo\'ladi...'}</div>
        </div>
      `));
      const micBtn = el(`<button class="btn ${recognizing?'btn-gold':'btn-primary'}" id="sp-mic">${recognizing ? '⏹ To\'xtatish' : '🎙 Gapirish'}</button>`);
      micBtn.onclick=()=>toggleRecognition();
      answerArea.appendChild(micBtn);
      answerArea.appendChild(el(`<div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">Mikrofon ishlamasa: brauzer ruxsat so'ragan bo'lishi kerak. Hali ham ishlamasa, sahifani Claude chatidan tashqarida, alohida brauzer tabida oching.</div>`));
    } else {
      answerArea.appendChild(el(`
        <div class="field">
          <label>Javobingiz (yozma shaklda — brauzeringiz ovozni matnga aylantirishni qo'llab-quvvatlamaydi)</label>
          <textarea id="sp-answer" rows="6" placeholder="Javobingizni shu yerga yozing..."></textarea>
        </div>
      `));
    }
  }

  function toggleRecognition(){
    if(recognizing){
      if(recognizer) try{ recognizer.stop(); }catch(e){}
      return;
    }
    recognizer = new SR();
    recognizer.lang = 'en-US';
    recognizer.continuous = true;
    recognizer.interimResults = true;
    let finalText = liveTranscript;
    recognizer.onresult = (e)=>{
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += (finalText?' ':'') + e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      liveTranscript = (finalText + ' ' + interim).trim();
      const box = answerArea.querySelector('#sp-transcript');
      if(box){ box.textContent = liveTranscript; box.style.color='var(--ink)'; }
    };
    recognizer.onerror = (e)=>{
      recognizing=false; state.busyRecording=false; renderAnswerArea();
      if(e.error==='not-allowed' || e.error==='permission-denied'){
        toast('Mikrofonga ruxsat berilmagan. Brauzer manzil qatoridagi qulf belgisini bosib, mikrofonga ruxsat bering.');
      } else if(e.error==='no-speech'){
        toast('Ovoz eshitilmadi — qayta urinib ko\'ring');
      } else if(e.error==='network'){
        toast('Internetga ulanish kerak — ovozni matnga o\'girish onlayn ishlaydi');
      } else {
        toast('Ovozni tanishda xatolik: '+e.error);
      }
    };
    recognizer.onend = ()=>{ recognizing=false; state.busyRecording=false; liveTranscript=finalText.trim(); renderAnswerArea(); };
    try{
      recognizer.start();
      recognizing = true;
      state.busyRecording = true;
      renderAnswerArea();
    }catch(err){
      toast('Mikrofonni ishga tushirib bo\'lmadi');
    }
  }

  renderAnswerArea();

  /* ===== AVTOMATIK SESSIYA: 10 soniyadan so'ng savollar birin-ketin aytiladi, har biridan keyin javob tinglanadi ===== */
  const _q0 = d.isGroup ? null : state.speakingQuestions.find(x=>x.id===d.id);
  const sessPart = d.isGroup ? 'part1' : ((_q0 && _q0.part) || 'part1');
  const sessQs = splitSpeakQs(topicVal, sessPart);
  const sLog = [];
  const sctl = {stop:null};
  let sQuit=false, sEnded=false, cdTimer=null;
  const sAlive = ()=> wrap.isConnected && !sQuit;
  const sessBox = document.createElement('div');
  sessBox.style.margin='6px 0 14px';
  sessBox.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;"><div class="ex-av" id="ss-av">👩‍🏫</div><div><div id="ss-part" style="font-weight:700;"></div><div id="ss-status" style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;"></div></div></div>
    <div class="ex-box" id="ss-q" style="margin-bottom:10px;display:none;"></div>
    <div class="ex-box" id="ss-tr" style="color:var(--ink-soft);display:none;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="btn btn-primary" id="ss-done" style="display:none;">✓ Javobni tugatdim</button>
      <button class="btn btn-ghost" id="ss-stop">To'xtatish</button>
      <button class="btn btn-ghost" id="ss-restart" style="display:none;">↻ Qayta boshlash</button>
    </div>`;
  const $s = sel => sessBox.querySelector(sel);
  const sStatus = t=>{ const e=$s('#ss-status'); if(e) e.textContent=t; };
  const sClean = ()=>{ sQuit=true; if(state.examOwner===wrap) state.busyRecording=false; if(sctl.stop) sctl.stop(); try{ speechSynthesis.cancel(); }catch(e){} clearInterval(cdTimer); clearInterval(swd); };
  const swd = setInterval(()=>{ if(!wrap.isConnected) sClean(); },1000);
  back.onclick = ()=>{ sClean(); state.detail=null; render(); };

  const sSay = async t=>{
    if(!sAlive()||sEnded) return;
    const av=$s('#ss-av'); if(av) av.classList.add('on');
    sStatus('Examiner gapiryapti...');
    const vs=enVoices();
    window.__speechBlocked=false;
    await examSay(t, vs[0]?vs[0].name:'');
    if(window.__speechBlocked && sAlive() && !sEnded){
      sStatus('Brauzer avtomatik ovozni blokladi — bir marta bosing');
      const b=el(`<button class="btn btn-primary" style="margin-top:10px;">🔊 Ovozni yoqish</button>`);
      sessBox.appendChild(b);
      await new Promise(r=>{ b.onclick=()=>{ b.remove(); primeSpeech(); r(); }; sctl.stop=()=>{ sctl.stop=null; b.remove(); r(); }; });
      sctl.stop=null; window.__speechBlocked=false;
      if(sAlive() && !sEnded){ sStatus('Examiner gapiryapti...'); await examSay(t, vs[0]?vs[0].name:''); }
    }
    if(av) av.classList.remove('on');
  };
  const sWait10 = ()=>new Promise(r=>{
    let n=10; sStatus('Tayyorlaning... '+n+' soniyadan so\'ng savol beriladi');
    cdTimer=setInterval(()=>{
      n--;
      if(n<=0||!sAlive()||sEnded){ clearInterval(cdTimer); sctl.stop=null; r(); }
      else sStatus('Tayyorlaning... '+n+' soniyadan so\'ng savol beriladi');
    },1000);
    sctl.stop=()=>{ clearInterval(cdTimer); sctl.stop=null; r(); };
  });

  async function runSession(){
    if(!wrap.isConnected) return;
    sQuit=false; sEnded=false; sLog.length=0;
    state.busyRecording=true; state.examOwner=wrap;
    field.style.display='none'; grpBox.style.display='none';
    $s('#ss-q').style.display='none'; $s('#ss-tr').style.display='none';
    $s('#ss-restart').style.display='none'; $s('#ss-stop').style.display='';
    $s('#ss-part').textContent = (SUBTYPE_LABEL[sessPart]||'Speaking');
    out.innerHTML=''; delete state.aiState[chatId];
    await sWait10();
    for(let i=0;i<sessQs.length;i++){
      if(!sAlive()||sEnded) break;
      const q=sessQs[i];
      $s('#ss-part').textContent=(SUBTYPE_LABEL[sessPart]||'Speaking')+' · '+(i+1)+'/'+sessQs.length;
      const qb=$s('#ss-q'); qb.textContent=q; qb.style.whiteSpace='pre-wrap'; qb.style.display='';
      const trb=$s('#ss-tr'); trb.textContent=''; trb.style.display='none';
      await sSay(sessPart==='part2' ? 'Here is your topic. '+q : q);
      if(!sAlive()||sEnded) break;
      let r={text:'',ms:0};
      const doneBtn=$s('#ss-done');
      if(speechSupported){
        sStatus('🎤 Sizning navbatingiz — gapiring');
        trb.style.display=''; trb.textContent='Javobingiz shu yerda paydo bo\'ladi...'; trb.style.color='var(--ink-soft)';
        doneBtn.style.display=''; doneBtn.textContent='✓ Javobni tugatdim';
        r = await examListen({ctl:sctl, onText:t=>{ trb.textContent=t; trb.style.color='var(--ink)'; },
          maxMs: sessPart==='part2'?120000:(sessPart==='part1'?60000:90000),
          silenceMs: sessPart==='part2'?8000:(sessPart==='part1'?3500:4500),
          noSpeechMs: sessPart==='part2'?15000:10000 });
        doneBtn.style.display='none';
        if(r.err==='mic'){ toast('Mikrofonga ruxsat bering va qayta urinib ko\'ring'); sEnded=true; }
      } else {
        sStatus('Javob bering, so\'ng "Keyingi savol" tugmasini bosing');
        doneBtn.style.display=''; doneBtn.textContent='Keyingi savol →';
        await new Promise(res=>{ sctl.stop=()=>{ sctl.stop=null; res(); }; });
        doneBtn.style.display='none';
      }
      if(r && (r.text||'').trim()) sLog.push({q, a:r.text.trim()});
      if(sAlive()&&!sEnded&&i<sessQs.length-1) await sSay(EXAM_ACK[Math.floor(Math.random()*EXAM_ACK.length)]);
    }
    if(!wrap.isConnected) return;
    $s('#ss-stop').style.display='none'; $s('#ss-done').style.display='none';
    $s('#ss-restart').style.display='';
    field.style.display=''; grpBox.style.display='';
    if(sAlive()&&!sEnded){
      await sSay('Thank you. That is the end of this part.');
      sStatus(sLog.length ? 'Tugadi. "AI fikrini olish" tugmasini bosing.' : 'Javob eshitilmadi — mikrofonni tekshirib, qayta boshlang.');
    } else {
      sStatus('To\'xtatildi.');
    }
  }
  $s('#ss-done').onclick=()=>{ if(sctl.stop) sctl.stop(); };
  $s('#ss-stop').onclick=()=>{ sEnded=true; if(sctl.stop) sctl.stop(); try{ speechSynthesis.cancel(); }catch(e){} };
  $s('#ss-restart').onclick=()=>{ try{ speechSynthesis.cancel(); }catch(e){} runSession(); };

  card.appendChild(sessBox);
  if(speechSupported) answerArea.style.display='none';
  card.appendChild(answerArea);
  field.style.display='none';
  setTimeout(()=>{ if(wrap.isConnected) runSession(); else { clearInterval(swd); } }, 60);

  card.appendChild(aiHintEl());
  const btn = el(`<button class="btn btn-primary" style="margin-top:14px;">AI fikrini olish</button>`);
  card.appendChild(btn);
  const out = document.createElement('div');
  card.appendChild(out);

  const chatId='speaking-'+d.id;
  function renderOut(){
    out.innerHTML='';
    const st = state.aiState[chatId];
    if(!st) return;
    if(st.loading && !st.text){
      out.appendChild(el(`<div class="thinking" style="margin-top:14px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Tahlil qilinmoqda...</div>`));
    } else {
      out.appendChild(el(`<div class="ai-box">${escapeHtml(st.text)}</div>`));
    }
  }
  btn.onclick=()=>{
    let topic = topicInput.value.trim();
    let answer = speechSupported ? liveTranscript.trim() : (card.querySelector('#sp-answer')||{value:''}).value.trim();
    if(sLog.length){
      topic = sLog.map(x=>x.q).join(' | ');
      answer = sLog.map((x,i)=>'Savol '+(i+1)+': '+x.q+' — Javob: '+x.a).join('\n');
    }
    if(!topic){ toast('Avval savolni tanlang yoki yozing'); return; }
    if(!answer || answer.split(/\s+/).filter(Boolean).length<3){ toast(speechSupported ? 'Mikrofonni bosib biroz gapiring (kamida bir necha so\'z)' : 'Javobingizni yozing'); return; }
    aiSpeakingFeedback(chatId, topic, answer, renderOut);
    renderOut();
  };
  renderOut();
  wrap.appendChild(card);
  return wrap;
}

/* ============ SPEAKING EXAMINER (jonli imtihon) ============ */
const EXAM_ACK=["Thank you.","Okay, thank you.","I see.","Alright.","Right, thank you.","Lovely, thank you."];
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((x,y)=>voiceScore(y)-voiceScore(x)); }catch(e){ return []; } }
function voiceScore(v){ let s=0; const n=v.name+' '+v.lang; if(/natural/i.test(n)) s+=6; if(/online/i.test(n)) s+=3; if(/google/i.test(n)) s+=3; if(/en[-_]GB/i.test(v.lang)) s+=2; if(/sonia|libby|ryan|daniel|serena|kate|samantha|aria|jenny|guy/i.test(n)) s+=2; if(/espeak|compact/i.test(n)) s-=6; return s; }
function primeSpeech(){ try{ if(!window.speechSynthesis) return; const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){} }
function examSay(text, voiceName){
  return new Promise(res=>{
    if(!window.speechSynthesis){ res(); return; }
    let done=false; const fin=()=>{ if(!done){ done=true; clearTimeout(t); res(); } };
    const t=setTimeout(fin, text.length*95+4000);
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const v=enVoices().find(x=>x.name===voiceName);
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
      u.rate=0.9; u.pitch=1; u.onend=fin; u.onerror=(ev)=>{ if(ev && (ev.error==='not-allowed')) window.__speechBlocked=true; fin(); };
      setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ fin(); } },80);
    }catch(e){ fin(); }
  });
}
function examListen(o){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const start=Date.now(); let base='', sess='', last=0, rec=null, over=false, had=false, iv=null;
    const full=()=>(base+' '+sess).trim();
    const finish=(err)=>{ if(over) return; over=true; clearInterval(iv); o.ctl.stop=null; try{ rec&&rec.stop(); }catch(e){} res({text:full(), ms:Date.now()-start, err}); };
    o.ctl.stop=()=>finish();
    const boot=()=>{
      rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
      rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=' '+e.results[i][0].transcript; sess=t.trim(); last=Date.now(); had=true; o.onText(full()); };
      rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') finish('mic'); };
      rec.onend=()=>{ if(over) return; base=full(); sess=''; setTimeout(()=>{ if(!over){ try{ boot(); }catch(e){} } },150); };
      try{ rec.start(); }catch(e){}
    };
    boot();
    iv=setInterval(()=>{
      const n=Date.now();
      if(!had && n-start>(o.noSpeechMs||10000)) finish();
      else if(had && n-last>o.silenceMs) finish();
      else if(n-start>o.maxMs) finish();
    },300);
  });
}
async function examScore(log){
  const tx=log.map(l=>{ const w=(l.a||'').split(/\s+/).filter(Boolean).length; const wpm=l.ms>3000?Math.round(w/(l.ms/60000)):0; return `[${SUBTYPE_LABEL[l.part]}] Examiner: ${l.q}\nCandidate (${w} so'z, ${Math.round(l.ms/1000)} soniya, ~${wpm} so'z/daqiqa): ${l.a||"(javob yo'q)"}`; }).join('\n\n');
  const prompt=`Siz rasmiy IELTS Speaking examinerisiz. Quyida imtihonning ovozdan matnga o'girilgan (speech-to-text) yozuvi. Matn avtomatik tanishdan chiqqan: tinish belgilari va ba'zi so'zlar tanish xatosi bo'lishi mumkin, shuning uchun faqat aniq grammatik xatolarni xato deb hisoblang.
${tx}

Javobni faqat o'zbek tilida, shu formatda bering:
1) Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation — har biriga band (0-9, 0.5 qadam). Pronunciation faqat matn tanilish sifati va ravonlikdan taxminiy baholanishini ochiq ayting.
2) Alohida qatorda: "UMUMIY BAND: X.X" (4 mezon o'rtachasi, 0.5 ga yaxlitlangan).
3) Eng muhim 4-6 ta xato: "xato -> to'g'ri varianti va sababi".
4) Lug'at va ravonlik bo'yicha 3 ta aniq amaliy tavsiya.
Halol baholang, ortiqcha maqtovsiz. Javoblar juda qisqa yoki bo'sh bo'lsa, ballni shunga mos tushiring.`;
  const r=await state.sample(prompt,{modelTier:'default'});
  return r.text;
}


function SpeakingExam(){
  const wrap=document.createElement('div');
  const back=el(`<button class="backlink">← Orqaga</button>`);
  wrap.appendChild(back);
  const box=document.createElement('div'); box.className='card'; box.style.padding='22px'; wrap.appendChild(box);
  const ctl={stop:null}; let running=false, quit=false, ended=false;
  const alive=()=>wrap.isConnected && !quit;
  const cleanup=()=>{ quit=true; running=false; if(state.examOwner===wrap) state.busyRecording=false; if(ctl.stop) ctl.stop(); try{ speechSynthesis.cancel(); }catch(e){} clearInterval(wd); };
  const wd=setInterval(()=>{ if(!wrap.isConnected) cleanup(); },1000);
  back.onclick=()=>{ cleanup(); state.detail=null; state.examReport=null; render(); };
  const cfg={mode:'full', voice:'', subs:false};
  const SRok=!!(window.SpeechRecognition||window.webkitSpeechRecognition);

  if(state.examReport){
    const r=state.examReport;
    box.appendChild(el(`<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:12px;"><div style="font-size:42px;font-weight:800;">${r.band!=null?r.band:'—'}</div><div style="color:var(--ink-soft);font-size:13px;">Speaking band · ${escapeHtml(r.title)}</div></div>`));
    box.appendChild(el(`<div class="ai-box">${escapeHtml(r.text)}</div>`));
    const det=el(`<details style="margin-top:14px;"><summary style="cursor:pointer;font-size:13px;color:var(--ink-soft);">Javoblaringiz matni</summary><div style="margin-top:8px;font-size:13px;line-height:1.6;">${r.log.map(l=>`<p><b>${SUBTYPE_LABEL[l.part]}:</b> ${escapeHtml(l.q)}<br>${escapeHtml(l.a||'(javob yo\'q)')}</p>`).join('')}</div></details>`);
    box.appendChild(det);
    const nb=el(`<button class="btn btn-primary" style="margin-top:16px;">Yangi imtihon</button>`);
    nb.onclick=()=>{ state.examReport=null; render(); };
    box.appendChild(nb);
    return wrap;
  }

  function setup(){
    box.innerHTML='';
    const cnt=p=>state.speakingQuestions.filter(q=>q.part===p).length;
    box.appendChild(el(`<div><h3 style="margin:0 0 6px;font-size:17px;">🎙 Examiner bilan Speaking imtihoni</h3><p style="margin:0 0 16px;font-size:13px;color:var(--ink-soft);line-height:1.5;">Savollar bazasi: Part 1 — ${cnt('part1')}, Part 2 — ${cnt('part2')}, Part 3 — ${cnt('part3')}.${state.user.isAdmin?' Yangi savol qo\'shish uchun "+" tugmasidan foydalaning.':''}</p></div>`));
    if(!SRok) box.appendChild(el(`<div class="err" style="margin-bottom:12px;">Brauzeringiz ovozni tanishni qo'llab-quvvatlamaydi. Chrome yoki Edge'da, alohida tabda oching.</div>`));
    box.appendChild(el(`<div style="font-size:12.5px;margin:-6px 0 14px;color:var(--gold);">${aiHintText()} (imtihon tahlili uchun)</div>`));
    box.appendChild(el(`<label>Imtihon turi</label>`));
    const seg=el(`<div class="seg" style="margin-bottom:14px;"></div>`);
    [['full',"To'liq"],['part1','Part 1'],['part2','Part 2'],['part3','Part 3']].forEach(([v,l])=>{
      const b=el(`<button type="button" class="${cfg.mode===v?'on':''}">${l}</button>`);
      b.onclick=()=>{ cfg.mode=v; seg.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); };
      seg.appendChild(b);
    });
    box.appendChild(seg);
    box.appendChild(el(`<label>Examiner ovozi</label>`));
    const sel=document.createElement('select'); sel.style.marginBottom='14px';
    const fill=()=>{ const vs=enVoices(); sel.innerHTML=vs.map(v=>`<option value="${escapeHtml(v.name)}">${escapeHtml(v.name)} (${v.lang})</option>`).join('')||'<option value="">Standart ovoz</option>'; if(!cfg.voice||!vs.find(v=>v.name===cfg.voice)) cfg.voice=vs[0]?vs[0].name:''; sel.value=cfg.voice; };
    fill(); try{ speechSynthesis.onvoiceschanged=fill; }catch(e){}
    sel.onchange=()=>{ cfg.voice=sel.value; };
    box.appendChild(sel);
    const sub=el(`<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:16px;"><input type="checkbox"> Savol matnini ham ko'rsatish (haqiqiy imtihonda faqat eshitasiz)</label>`);
    sub.querySelector('input').onchange=e=>{ cfg.subs=e.target.checked; };
    box.appendChild(sub);
    const go=el(`<button class="btn btn-primary">Imtihonni boshlash</button>`);
    go.onclick=async()=>{
      if(!SRok){ toast('Bu brauzerda mikrofon orqali tanish ishlamaydi'); return; }
      const qs=state.speakingQuestions, by=p=>shuf(qs.filter(q=>q.part===p).map(q=>q.text));
      const items=[]; const add=(p,n)=>{ let c=0; for(const t of by(p)){ if(c>=n) break; splitSpeakQs(t,p).forEach(q=>{ items.push({part:p,text:q}); c++; }); } };
      if(cfg.mode==='full'||cfg.mode==='part1') add('part1',4+Math.floor(Math.random()*2));
      if(cfg.mode==='full'||cfg.mode==='part2') add('part2',1);
      if(cfg.mode==='full'||cfg.mode==='part3') add('part3',cfg.mode==='full'?3:5);
      if(!items.length){ toast("Bu tur uchun savol qo'shilmagan"); return; }
      if(!(await chargeAiAnalysis())){ setup(); return; }
      ['part1','part2','part3'].forEach(p=>{ const a=items.filter(i=>i.part===p); a.forEach((i,k)=>{ i.n=k+1; i.of=a.length; }); });
      run(items);
    };
    box.appendChild(go);
  }

  async function run(items){
    running=true; ended=false; state.busyRecording=true; state.examOwner=wrap;
    const log=[];
    box.innerHTML='';
    box.appendChild(el(`<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;"><div class="ex-av" id="ex-av">👩‍🏫</div><div><div id="ex-part" style="font-weight:700;"></div><div id="ex-status" style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;"></div></div></div>`));
    const qEl=el(`<div class="ex-box" style="margin-bottom:10px;display:none;"></div>`);
    const tr=el(`<div class="ex-box" style="color:var(--ink-soft);">Javobingiz shu yerda paydo bo'ladi...</div>`);
    box.appendChild(qEl); box.appendChild(tr);
    const row=el(`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"></div>`);
    const bDone=el(`<button class="btn btn-primary" style="display:none;">✓ Javobni tugatdim</button>`);
    const bEnd=el(`<button class="btn btn-ghost">Tugatish va baholash</button>`);
    row.appendChild(bDone); row.appendChild(bEnd); box.appendChild(row);
    const $=s=>box.querySelector(s);
    const status=t=>{ $('#ex-status').textContent=t; };
    const showQ=(t,v)=>{ qEl.style.display=v?'':'none'; qEl.textContent=t; };
    const say=async t=>{ if(!alive()||ended) return; $('#ex-av').classList.add('on'); status('Examiner gapiryapti...'); await examSay(t,cfg.voice); const a=$('#ex-av'); if(a) a.classList.remove('on'); };
    bDone.onclick=()=>{ if(ctl.stop) ctl.stop(); };
    bEnd.onclick=()=>{ ended=true; if(ctl.stop) ctl.stop(); try{ speechSynthesis.cancel(); }catch(e){} };
    const answer=async o=>{
      status('🎤 Sizning navbatingiz — gapiring'); tr.textContent=''; bDone.style.display='';
      let tm=null; if(o.timer){ const t0=Date.now(); tm=setInterval(()=>{ const q=Math.max(0,Math.round((o.maxMs-(Date.now()-t0))/1000)); status('🎤 Gapiring — qoldi '+Math.floor(q/60)+':'+String(q%60).padStart(2,'0')); },1000); }
      const r=await examListen(Object.assign({ctl,onText:t=>{ tr.textContent=t; tr.style.color='var(--ink)'; }},o));
      clearInterval(tm);
      bDone.style.display='none';
      if(r.err==='mic'){ toast('Mikrofonga ruxsat bering va qayta urinib ko\'ring'); ended=true; }
      return r;
    };
    const prep=()=>new Promise(r=>{
      let s=60; bDone.textContent='Tayyorman'; bDone.style.display='';
      const end=()=>{ clearInterval(t); ctl.stop=null; bDone.style.display='none'; bDone.textContent='✓ Javobni tugatdim'; r(); };
      const t=setInterval(()=>{ s--; status('✍ Tayyorgarlik: 0:'+String(s).padStart(2,'0')+" — qog'ozga yozib oling"); if(s<=0||!alive()||ended) end(); },1000);
      ctl.stop=end; status("✍ Tayyorgarlik: 1:00 — qog'ozga yozib oling");
    });
    const h=new Date().getHours(), greet=h<12?'morning':h<18?'afternoon':'evening';
    const intro={
      part1:`Good ${greet}. My name is Sarah Mitchell, and I'll be your examiner today. In this first part, I'd like to ask you some questions about yourself and some familiar topics.`,
      part2:`Now, I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say, and you can make some notes if you wish.`,
      part3:`Now, we've been talking about a topic, and I'd like to ask you some more general questions related to it.`
    };
    let lastPart=null;
    for(const it of items){
      if(!alive()||ended) break;
      $('#ex-part').textContent=SUBTYPE_LABEL[it.part]+' · '+it.n+'/'+it.of;
      if(it.part!==lastPart){ lastPart=it.part; await say(intro[it.part]); }
      if(!alive()||ended) break;
      let r;
      if(it.part==='part2'){
        showQ(it.text,true);
        await say('Here is your topic. '+it.text);
        if(!alive()||ended) break;
        await prep();
        await say('All right? Please begin speaking now. Remember, you have up to two minutes.');
        if(!alive()||ended) break;
        r=await answer({maxMs:120000,silenceMs:25000,noSpeechMs:15000,timer:true});
        if(alive()&&!ended) await say("Thank you. That's the end of Part 2.");
      } else {
        showQ(it.text,cfg.subs);
        await say(it.text);
        if(!alive()||ended) break;
        r=await answer({maxMs:it.part==='part1'?60000:90000,silenceMs:it.part==='part1'?3500:4500,noSpeechMs:10000});
        if(alive()&&!ended&&it!==items[items.length-1]) await say(EXAM_ACK[Math.floor(Math.random()*EXAM_ACK.length)]);
      }
      if(r) log.push({part:it.part,q:it.text,a:r.text,ms:r.ms});
    }
    if(!alive()){ cleanup(); return; }
    if(!ended) await say('Thank you. That is the end of the speaking test.');
    running=false;
    if(!log.some(l=>(l.a||'').split(/\s+/).filter(Boolean).length>=3)){ toast('Javob eshitilmadi — mikrofonni tekshiring'); state.busyRecording=false; setup(); return; }
    box.innerHTML='<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Examiner baholayapti...</div>';
    let text; try{ text=await examScore(log); }catch(e){ text='Baholashda xatolik yuz berdi. Qayta urinib ko\'ring.'; }
    const m=text.match(/UMUMIY BAND:\s*([\d.]+)/i); const band=m?parseFloat(m[1]):null;
    const title='Examiner: '+({full:"To'liq test",part1:'Part 1',part2:'Part 2',part3:'Part 3'}[cfg.mode]);
    state.examReport={text,band,title,log};
    state.busyRecording=false;
    if(band!=null) await saveResultAttempt({ id:uid(), section:'speaking', subtype:cfg.mode, examId:'speaking-exam', examTitle:title, isMock:false, mockId:null, band, date:Date.now() });
    else render();
  }
  setup();
  return wrap;
}

/* Bitta matndagi bir nechta savolni alohida-alohida savollarga ajratadi (Part 2 cue card bo'linmaydi) */
function splitSpeakQs(text, part){
  const t=(text||'').trim();
  if(!t) return [];
  if(part==='part2') return [t];
  const out=[];
  t.split(/\r?\n+/).forEach(line=>{
    line=line.replace(/^\s*(?:\d+[\.\)]|[-•*])\s*/,'').trim();
    if(!line) return;
    line.split(/(?<=\?)\s+/).forEach(q=>{ q=q.trim(); if(q) out.push(q); });
  });
  return out.length?out:[t];
}

function speakText(text){
  if(!window.speechSynthesis){ toast('Brauzeringiz ovozli o\'qishni qo\'llab-quvvatlamaydi'); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// Kunlik vazifani ro'yxatdan o'tgan kunidan boshlab, TANLANGAN OY SONIGA (examMonths)
// mos ravishda 3 bosqichga bo'lib beradi — shunchaki 7 kunlik doiraviy ro'yxat emas.
function getTodaysTask(user){
  if(!user.createdAt || !user.examMonths || !user.phase1Tasks || !user.phase2Tasks || !user.phase3Tasks) return null;
  const daysSince = Math.floor((Date.now()-user.createdAt)/86400000);
  const totalDays = Math.max(14, Math.round(user.examMonths*30));
  const dayInCycle = daysSince % totalDays; // imtihon sanasidan keyin yangi tsikl (yangi maqsad) boshlanadi deb hisoblanadi
  const p1 = user.phase1Days || Math.round(totalDays*0.4);
  const p2 = user.phase2Days || Math.round(totalDays*0.4);
  let phaseLabel, task;
  if(dayInCycle < p1){
    phaseLabel = "1-bosqich: Asos";
    task = user.phase1Tasks[dayInCycle % user.phase1Tasks.length];
  } else if(dayInCycle < p1+p2){
    phaseLabel = "2-bosqich: Amaliyot";
    task = user.phase2Tasks[(dayInCycle-p1) % user.phase2Tasks.length];
  } else {
    phaseLabel = "3-bosqich: Imtihon oldi";
    task = user.phase3Tasks[(dayInCycle-p1-p2) % user.phase3Tasks.length];
  }
  return { phaseLabel, task, dayNumber: dayInCycle+1, totalDays };
}

function planEntry(skill, day, phase, weak, minutes, weekNo){
  if(skill==='mock') return planMockEntry(phase, weak, minutes, weekNo);
  if(skill==='reading') return planReadingEntry(day);
  if(skill==='listening') return planListeningEntry(day);
  if(skill==='writing') return planWritingEntry(day);

// Foydalanuvchi sozlamalariga (kuniga soat, zaif tomon, imtihon muddati, bosqich) mos kunlik reja
function buildDayPlan(user, cycleDay){
  const hours = Math.min(4, Math.max(1, Math.round(user.dailyHours||1)));
  const mins = PLAN_MINUTES[hours];
  const weak = user.weakSkill || 'writing';
  const totalDays = Math.max(14, Math.round((user.examMonths||1)*30));
  const p1 = user.phase1Days || Math.round(totalDays*0.4);
  const p2 = user.phase2Days || Math.round(totalDays*0.4);
  const phase = cycleDay < p1 ? 1 : (cycleDay < p1+p2 ? 2 : 3);
  const phaseLabel = phase===1 ? "1-bosqich: Asos" : phase===2 ? "2-bosqich: Amaliyot" : "3-bosqich: Imtihon oldi";
  const dow = cycleDay % 7;
  const weekNo = Math.floor(cycleDay/7);

  let order = PLAN_WEEK_ORDER[dow].slice();
  if(phase===3 && (dow===0 || dow===2 || dow===4)){
    order = ['mock','review'].concat(order.filter(x=>x!=='mock' && x!=='review').slice(1));
  } else if(phase!==3 && (dow===0 || dow===2 || dow===4)){
    const wi = order.indexOf(weak);
    if(wi>0){ order.splice(wi,1); order.unshift(weak); }
  }
  const mainCount = mins.length-1;
  const skills = order.slice(0, mainCount).concat(['vocab']);

  const blocks = skills.map((skill, i)=>{
    const minutes = mins[i];
    const entry = planEntry(skill, cycleDay + PLAN_SALT[skill], phase, weak, minutes, weekNo);
    let extra = '';
    if(phase===3 && ['listening','reading','writing','speaking'].indexOf(skill)>=0){
      extra = "⏱ Imtihon rejimi: aniq vaqt bilan, lug'atsiz bajaring.";
    } else if(skill===weak){
      extra = "⭐ Bu sizning zaif tomoningiz — shu sababli bugun unga eng ko'p vaqt ajratilgan.";
    }
    return { skill, icon:PLAN_SKILL[skill].icon, name:PLAN_SKILL[skill].name, minutes, title:entry.t, steps:entry.s, extra };
  });
  const focus = blocks.slice(0, 2).map(b=>b.name).join(' + ');
  return {
    phase, phaseLabel, cycleDay, hours, totalMinutes:hours*60, blocks,
    title: dow===6 ? "Takrorlash kuni: xatolar tahlili va yengil mashqlar" : ("Bugungi fokus: "+focus),
    tip: ''
  };
}

function planCtxForDay(user, absDay){
  const totalDays = Math.max(14, Math.round((user.examMonths||1)*30));
  return { absDay, cycleDay: absDay % totalDays, totalDays, week: Math.floor(absDay/7) };
}
function planCtx(user){
  if(!user || !user.createdAt || !user.examMonths || !user.dailyHours) return null;
  const absDay = Math.max(0, Math.floor((Date.now()-user.createdAt)/86400000));
  return planCtxForDay(user, absDay);
}
function isPlanDayUnlocked(absDay){
  if(!state.user) return false;
  if(state.user.isAdmin) return true;
  if(state.wallet && state.wallet.vip) return true;
  if(absDay < PLAN_FREE_DAYS) return true;
  const wkKey = 'planweek:'+Math.floor(absDay/7);   // eski haftalik ochilganlar ham ishlayveradi
  const dayKey = 'planday:'+absDay;
  return (state.unlocks||[]).some(u=>u.exerciseId===dayKey || u.exerciseId===wkKey);
}

function PlanBlockCard(b, showSteps, opts){
  const extraHtml = b.extra ? `<div style="margin-top:10px;font-size:12.5px;color:var(--gold);font-weight:700;">${escapeHtml(b.extra)}</div>` : '';
  const chkStyle = 'flex:none;width:24px;height:24px;margin-top:1px;border-radius:6px;border:2px solid var(--line);background:transparent;color:#fff;font-size:15px;font-weight:800;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;';
  let stepsHtml;
  if(!showSteps){
    stepsHtml = `<div style="margin-top:10px;font-size:12.5px;color:var(--ink-soft);">🔒 Batafsil qadamlar coin bilan ochiladi</div>`;
  } else if(opts){
    stepsHtml = `<div style="margin-top:12px;display:flex;flex-direction:column;gap:9px;">${b.steps.map((s,j)=>`<div class="plan-step" data-j="${j}" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13.5px;line-height:1.55;"><button type="button" class="plan-check" aria-label="Bajarildi deb belgilash" style="${chkStyle}"></button><span class="plan-step-text" style="flex:1;min-width:0;">${escapeHtml(s)}</span></div>`).join('')}</div>${extraHtml}`;
  } else {
    stepsHtml = `<ol style="margin:12px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65;">${b.steps.map(s=>`<li style="margin-bottom:4px;">${escapeHtml(s)}</li>`).join('')}</ol>${extraHtml}`;
  }
  const card = el(`
    <div class="card" style="padding:16px 18px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:24px;">${b.icon}</span>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:15px;">${escapeHtml(b.name)}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">${showSteps ? escapeHtml(b.title) : 'Reja yopiq'}</div>
        </div>
        ${(showSteps && opts) ? `<span class="tag plan-count">0/${b.steps.length}</span>` : ''}
        <span class="tag">${b.minutes} daq</span>
      </div>
      ${stepsHtml}
    </div>
  `);
  if(showSteps && opts){
    const rows = Array.from(card.querySelectorAll('.plan-step'));
    card._rows = rows;
    card._paintStep = (j, done)=>{
      const r = rows[j]; if(!r) return;
      const chk = r.querySelector('.plan-check');
      chk.textContent = done ? '✓' : '';
      chk.style.background = done ? '#22c55e' : 'transparent';
      chk.style.borderColor = done ? '#22c55e' : 'var(--line)';
      const t = r.querySelector('.plan-step-text');
      t.style.textDecoration = done ? 'line-through' : 'none';
      t.style.opacity = done ? '0.6' : '1';
    };
    card._paintCount = (n)=>{
      const total = b.steps.length;
      const tag = card.querySelector('.plan-count');
      tag.textContent = n+'/'+total;
      const all = n>=total && total>0;
      tag.style.background = all ? 'rgba(34,197,94,0.25)' : '';
      tag.style.color = all ? '#22c55e' : '';
      card.style.borderColor = all ? 'rgba(34,197,94,0.6)' : '';
      card.style.background = all ? 'rgba(34,197,94,0.07)' : '';
    };
    rows.forEach((r,j)=>{
      card._paintStep(j, !!opts.isDone(j));
      r.onclick = ()=>opts.onToggle(j);
    });
    card._paintCount(b.steps.filter((_,j)=>opts.isDone(j)).length);
  }
  return card;
}

function PlanPage(){
  const wrap = document.createElement('div');
  wrap.setAttribute('data-plan','1');
  const u = state.user;
  wrap.appendChild(el(`
    <div class="pagehead">
      <h1>Kunlik reja</h1>
      <p>Kuniga ${u.dailyHours||'?'} soatlik shaxsiy reja: tinglash, o'qish, yozish, gapirish va yangi so'zlarni yodlash — sizning zaif tomoningiz va imtihon muddatingizga moslab.</p>
    </div>
  `));
  const ctx = planCtx(u);
  if(!ctx){
    wrap.appendChild(el(`<div class="card empty">Reja topilmadi. Chiqib, qayta kirib, reja ma'lumotlarini to'ldiring.</div>`));
    return wrap;
  }
  const today = ctx.absDay;
  const curWeek = Math.floor(today/7);
  const planAllOpen = !!u.isAdmin || !!(state.wallet && state.wallet.vip);
  const maxWeek = planAllOpen ? Math.max(curWeek, Math.ceil(ctx.totalDays/7)-1) : curWeek;
  let week = (state.planWeek==null || state.planWeek>maxWeek) ? curWeek : state.planWeek;
  let sel = state.planDay;
  if(sel==null || Math.floor(sel/7)!==week) sel = (week===curWeek) ? today : week*7;

  const nav = el(`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="btn btn-sm" id="pw-prev" ${week<=0?'disabled':''}>‹</button>
      <span style="font-weight:800;font-size:14px;">${week+1}-hafta</span>
      <button class="btn btn-sm" id="pw-next" ${week>=maxWeek?'disabled':''}>›</button>
    </div>
  `);
  nav.querySelector('#pw-prev').onclick=()=>{ state.planWeek=week-1; state.planDay=null; render(); };
  nav.querySelector('#pw-next').onclick=()=>{ state.planWeek=week+1; state.planDay=null; render(); };
  wrap.appendChild(nav);

  const tabs = document.createElement('div');
  tabs.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;';
  for(let i=0;i<7;i++){
    const d = week*7+i;
    if(planAllOpen && d>=Math.max(ctx.totalDays, today+1)) continue;
    const isSel = d===sel;
    const isToday = d===today;
    const free = d < PLAN_FREE_DAYS;
    const tb = el(`<button class="btn btn-sm ${isSel?'btn-primary':''}">${d+1}-kun${isToday?' ·bugun':''}${isPlanDayUnlocked(d)?' ✓':' 🔒'}</button>`);
    tb.onclick=()=>{ state.planDay=d; render(); };
    tabs.appendChild(tb);
  }
  wrap.appendChild(tabs);

  const dctx = planCtxForDay(u, sel);
  const plan = buildDayPlan(u, dctx.cycleDay);
  const unlocked = isPlanDayUnlocked(sel);

  wrap.appendChild(el(`
    <div class="card" style="padding:16px 20px;margin-bottom:14px;background:linear-gradient(120deg, rgba(124,108,255,0.18), rgba(63,203,255,0.14));">
      <div style="font-size:11px;font-weight:800;color:var(--accent-b);letter-spacing:0.04em;">${sel+1}-KUN · ${escapeHtml(plan.phaseLabel)} · jami ${plan.totalMinutes} daqiqa</div>
      <div style="font-size:16px;font-weight:800;margin-top:4px;">${escapeHtml(plan.title)}</div>
      ${(unlocked && plan.tip) ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.55;">💡 ${escapeHtml(plan.tip)}</div>` : ''}
    </div>
  `));

  if(!unlocked){
    const lock = el(`
      <div class="card" style="padding:22px 20px;margin-bottom:14px;text-align:center;">
        <div style="font-size:28px;margin-bottom:8px;">🔒</div>
        <div style="font-weight:800;font-size:15px;margin-bottom:6px;">${sel+1}-kunning rejasi yopiq</div>
        <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 14px;line-height:1.55;">Bu kunning batafsil qadamlari (nima qilish, qancha vaqt, qanday tekshirish) ${PLAN_DAY_COST} coin evaziga ochiladi. Dastlabki ${PLAN_FREE_DAYS} kun bepul, VIP uchun hammasi ochiq. Balansingiz: ${u.isAdmin ? '—' : (state.wallet.coins||0)+' coin'}.</p>
        <button class="btn btn-primary" id="pl-unlock">🔓 ${PLAN_DAY_COST} coinga ochish</button>
        <button class="btn btn-gold" id="pl-shop" style="margin-left:8px;">🪙 Coin sotib olish</button>
      </div>
    `);
    lock.querySelector('#pl-unlock').onclick=()=>{ unlockPlanDay(sel); };
    lock.querySelector('#pl-shop').onclick=()=>{ state.shopOpen=true; render(); };
    wrap.appendChild(lock);
  }
  if(!unlocked){
    plan.blocks.forEach(b=>wrap.appendChild(PlanBlockCard(b, false)));
  } else {
    // Har bir qadam (Reading, Listening, Writing, Speaking ... ichidagi topshiriqlar) alohida belgilanadi.
    // Saqlash: "unlocks" jadvalida 'plandone:<kun>:<blok>:<qadam>' yozuvi sifatida.
    const cards = [];
    const totalSteps = plan.blocks.reduce((a,b)=>a+b.steps.length,0) || 1;
    const doneKey = (i,j) => 'plandone:'+sel+':'+i+':'+j;
    const findDone = (i,j) => (state.unlocks||[]).find(u=>u.exerciseId===doneKey(i,j));
    const prog = el(`
      <div class="card" style="padding:16px 18px;margin:4px 0 12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div style="font-weight:800;font-size:15px;">📊 Bugungi natija</div>
          <div class="pg-pct" style="font-weight:800;font-size:22px;color:#22c55e;">0%</div>
        </div>
        <div style="height:10px;border-radius:999px;background:rgba(255,255,255,0.08);margin-top:10px;overflow:hidden;">
          <div class="pg-bar" style="height:100%;width:0%;background:#22c55e;border-radius:999px;transition:width .3s;"></div>
        </div>
        <div class="pg-note" style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;"></div>
      </div>
    `);
    const updateProg = ()=>{
      let n = 0;
      plan.blocks.forEach((b,i)=>{
        let bn = 0;
        b.steps.forEach((_,j)=>{ if(findDone(i,j)) bn++; });
        n += bn;
        if(cards[i] && cards[i]._paintCount) cards[i]._paintCount(bn);
      });
      const pct = Math.round(n/totalSteps*100);
      prog.querySelector('.pg-pct').textContent = pct+'%';
      prog.querySelector('.pg-bar').style.width = pct+'%';
      prog.querySelector('.pg-note').textContent = pct>=100
        ? '🎉 Ajoyib! Bugungi rejaning hammasi bajarildi.'
        : n+' / '+totalSteps+' topshiriq bajarildi';
    };
    const scrollNext = (bi, sj)=>{
      // tekis ro'yxatda keyingi bajarilmagan qadamni topamiz
      const flat = [];
      plan.blocks.forEach((b,i)=>b.steps.forEach((_,j)=>flat.push([i,j])));
      const from = flat.findIndex(([i,j])=>i===bi && j===sj);
      let target = prog;
      for(let k=1;k<=flat.length;k++){
        const [i,j] = flat[(from+k)%flat.length];
        if(!findDone(i,j)){ target = (cards[i]._rows && cards[i]._rows[j]) || cards[i]; break; }
      }
      setTimeout(()=>{ try{ target.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){} }, 120);
    };
    const toggle = async (i,j)=>{
      state.unlocks = state.unlocks || [];
      const key = myPhoneKey();
      const ex = findDone(i,j);
      if(ex){
        state.unlocks = state.unlocks.filter(u=>u!==ex);
        cards[i]._paintStep(j,false); updateProg();
        try{ if(state.db && ex.id) await state.db.doc('unlocks/'+ex.id).delete(); }catch(e){ toast('Belgini o\'chirish serverga saqlanmadi'); }
        return;
      }
      const rec = { id:uid(), phone:key||'', exerciseId:doneKey(i,j), method:'done', createdAt:Date.now() };
      state.unlocks.push(rec);
      cards[i]._paintStep(j,true); updateProg(); scrollNext(i,j);
      try{ if(state.db && key) await state.db.doc('unlocks/'+rec.id).set(rec); }catch(e){ toast('Belgi serverga saqlanmadi'); }
    };
    plan.blocks.forEach((b,i)=>{
      const c = PlanBlockCard(b, true, { isDone: (j)=>!!findDone(i,j), onToggle: (j)=>toggle(i,j) });
      cards.push(c); wrap.appendChild(c);
    });
    wrap.appendChild(prog);
    updateProg();
  }
  if(unlocked){
    wrap.appendChild(el(`<p style="font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;">Mashqlar (Reading, Listening, Diktant, Writing, Speaking, Mock) tekin — lekin ularni ishlash uchun bugungi kunlik reja ochiq bo'lishi kerak.</p>`));
  }
  return wrap;
}

function dayOfYear(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  return Math.floor((now-start)/86400000);
}
function todaysVocab(){
  if(!state.vocab.length) return [];
  const n = Math.min(5, state.vocab.length);
  const offset = dayOfYear() % state.vocab.length;
  const out = [];
  for(let i=0;i<n;i++) out.push(state.vocab[(offset+i)%state.vocab.length]);
  return out;
}

      ["It is noticeable that...","Shu e'tiborga loyiqki...","Task 1 — asosiy qismda muhim detalni ajratishda","Eng muhim raqamni ajratib ko'rsatish","It is noticeable that the figure for 2010 was the highest."],
      ["The figure for... rose sharply from ... to ...","... ko'rsatkichi ... dan ... gacha keskin oshdi","Task 1 — trendni raqamlar bilan tasvirlashda","Trend va aniq ma'lumotni bir gapda berish","The figure for exports rose sharply from 10% to 40%."],
      ["It is often argued that... However, I believe that...","Ko'pincha ... deyishadi. Biroq men ... deb hisoblayman","Task 2 — kirish va o'z fikringiz (thesis)","Mavzuni tanishtirib, fikringizni darhol aniq bildirish","It is often argued that homework is useless. However, I believe it is essential."],
      ["This essay will discuss both views and give my own opinion.","Bu esse ikkala fikrni ko'rib chiqadi va o'z fikrimni bildiradi","Task 2 — kirishning oxirida (discuss both views essesi)","Essening tuzilishini examinerga aniq ko'rsatadi","This essay will discuss both views and give my own opinion."],
      ["One of the main reasons for this is that...","Buning asosiy sabablaridan biri shuki...","Task 2 — asosiy qism, sabab keltirishda","Paragrafni aniq g'oya (topic sentence) bilan boshlash","One of the main reasons for this is that people have less free time."],
      ["For instance, / For example,","Masalan,","Task 2 — g'oyani misol bilan isbotlashda","Fikrni asoslash — Task Response balini oshiradi","For instance, many cities now offer free bike rental."],
      ["Another significant point is that...","Yana bir muhim jihat shuki...","Task 2 — ikkinchi g'oyaga o'tishda","Yangi g'oyaga silliq o'tish","Another significant point is that costs are rising."],
      ["In conclusion, while..., I firmly believe that...","Xulosa qilib aytganda, garchi ..., men ... ga qat'iy ishonaman","Task 2 — xulosa paragrafi","Fikringizni qaytadan tasdiqlab, essega yakun yasash","In conclusion, while technology has risks, I firmly believe its benefits are greater."],
    ]
  }
};

function VocabRow(it){
  const chips = [];
  if(it.where) chips.push(`<div style="font-size:12.5px;margin-top:6px;"><span style="color:var(--accent-b);font-weight:800;">📍 Qayerda:</span> <span style="color:var(--ink-soft);">${escapeHtml(it.where)}</span></div>`);
  if(it.why) chips.push(`<div style="font-size:12.5px;margin-top:3px;"><span style="color:var(--gold);font-weight:800;">🎯 Nima uchun:</span> <span style="color:var(--ink-soft);">${escapeHtml(it.why)}</span></div>`);
  const row = el(`
    <div class="card exrow" style="cursor:default;align-items:flex-start;">
      <div style="flex:1;min-width:0;">
        <div class="ttl" style="font-size:15px;">${escapeHtml(it.text)}</div>
        <div style="font-size:13.5px;margin-top:3px;">${escapeHtml(it.meaning)}</div>
        ${chips.join('')}
        ${it.example ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-style:italic;">“${escapeHtml(it.example)}”</div>` : ''}
      </div>
      ${it.v && state.user.isAdmin ? `<button class="del-btn" title="O'chirish">🗑</button>` : ''}
    </div>
  `);
  if(it.v && state.user.isAdmin){
    const dBtn = row.querySelector('.del-btn');
    dBtn.onclick=()=>armConfirm(dBtn, ()=>deleteVocabWord(it.v), "Ishonchmi?");
  }
  return row;
}

function VocabPage(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`
    <div class="pagehead">
      <h1>Vocabulary</h1>
      <p>Speaking va Writing uchun so'zlar va tayyor gaplar — har biri qayerda va nima uchun ishlatilishi bilan.</p>
    </div>
  `));

  const tab = state.vocabTab==='writing' ? 'writing' : 'speaking';

  const today = todaysVocab();
  if(today.length){
    wrap.appendChild(el(`<h3 style="margin:0 0 8px;font-size:15px;">Bugungi so'zlar</h3>`));
    const tl = document.createElement('div'); tl.className='list';
    today.forEach(v=>tl.appendChild(VocabRow({ text:v.word, meaning:v.meaning, where:v.where, why:v.why, example:v.example })));
    wrap.appendChild(tl);
    wrap.appendChild(el(`<div class="divider"></div>`));
  }

  const tabs = el(`
    <div class="tabs">
      <button class="${tab==='speaking'?'on':''}" data-t="speaking">🎙 Speaking</button>
      <button class="${tab==='writing'?'on':''}" data-t="writing">✍️ Writing</button>
    </div>
  `);
  tabs.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ state.vocabTab=b.dataset.t; render(); }; });
  wrap.appendChild(tabs);

  const custom = (state.vocab||[]).filter(v=>v.sec===tab || !v.sec);   // bo'limi belgilanmagan eski so'zlar ikkala tabda ko'rinadi
  const customOf = kind => custom.filter(v=>(v.kind||'word')===kind).map(v=>({ text:v.word, meaning:v.meaning, where:v.where, why:v.why, example:v.example, v }));
  const sections = [
    ['words',     "So'zlar va iboralar"],
    ['sentences', "Tayyor gaplar"]
  ];
  sections.forEach(([kind, label])=>{
    const base = VOCAB_BUILTIN[tab][kind].map(a=>({ text:a[0], meaning:a[1], where:a[2], why:a[3], example:a[4] }));
    const items = base.concat(customOf(kind==='words'?'word':'sentence'));
    wrap.appendChild(el(`<h3 style="margin:18px 0 8px;font-size:15px;">${label} (${items.length})</h3>`));
    const list = document.createElement('div'); list.className='list';
    items.forEach(it=>list.appendChild(VocabRow(it)));
    wrap.appendChild(list);
  });

  if(state.user.isAdmin){
    const addCard = document.createElement('div');
    addCard.className='card';
    addCard.style.cssText='padding:16px 18px;margin:18px 0 16px;';
    addCard.appendChild(el(`<label>Yangi so'z / gap qo'shish (faqat admin)</label>`));
    addCard.appendChild(el(`
      <div class="row2" style="margin-bottom:10px;">
        <select id="v-sec"><option value="speaking" ${tab==='speaking'?'selected':''}>Speaking</option><option value="writing" ${tab==='writing'?'selected':''}>Writing</option></select>
        <select id="v-kind"><option value="word">So'z / ibora</option><option value="sentence">Gap</option></select>
      </div>
      <div class="row2" style="margin-bottom:10px;">
        <input type="text" id="v-word" placeholder="So'z yoki gap (masalan: meticulous)">
        <input type="text" id="v-meaning" placeholder="Ma'nosi">
      </div>
      <div class="row2" style="margin-bottom:10px;">
        <input type="text" id="v-where" placeholder="Qayerda ishlatiladi (masalan: Task 2 — xulosa)">
        <input type="text" id="v-why" placeholder="Nima uchun ishlatiladi">
      </div>
      <input type="text" id="v-example" placeholder="Misol jumla (ixtiyoriy)" style="margin-bottom:10px;">
    `));
    const addBtn = el(`<button class="btn btn-primary">Qo'shish</button>`);
    addBtn.onclick=()=>{
      const g = id=>addCard.querySelector(id).value.trim();
      if(!g('#v-word') || !g('#v-meaning')){ toast("So'z (gap) va ma'nosini kiriting"); return; }
      addVocabWord({ word:g('#v-word'), meaning:g('#v-meaning'), example:g('#v-example'), where:g('#v-where'), why:g('#v-why'), sec:g('#v-sec'), kind:g('#v-kind') });
      ['#v-word','#v-meaning','#v-where','#v-why','#v-example'].forEach(id=>{ addCard.querySelector(id).value=''; });
    };
    addCard.appendChild(addBtn);
    wrap.appendChild(addCard);
  }
  return wrap;
}

/* ============ PROGRESS PAGE ============ */
function ProgressPage(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`
    <div class="pagehead">
      <h1>Natijalarim</h1>
      <p>Barcha urinishlaringiz va band tarixi.</p>
    </div>
  `));
  const attempts = state.results.attempts || [];

  const bandsBySection = {reading:[], listening:[], writing:[], speaking:[]};
  attempts.forEach(a=>{ if(bandsBySection[a.section] && a.band!=null) bandsBySection[a.section].push(a.band); });
  const avg = arr=> arr.length? (arr.reduce((s,v)=>s+v,0)/arr.length) : null;

  const overallVals = attempts.map(a=>a.band).filter(b=>b!=null);
  const overallAvg = avg(overallVals);

  const stats = document.createElement('div');
  stats.className='stat-grid';
  stats.appendChild(el(`<div class="card stat"><div class="n">${overallAvg!=null?overallAvg.toFixed(1):'—'}</div><div class="lbl">O'rtacha band</div></div>`));
  stats.appendChild(el(`<div class="card stat"><div class="n">${attempts.length}</div><div class="lbl">Jami urinish</div></div>`));
  stats.appendChild(el(`<div class="card stat"><div class="n">${bandsBySection.reading.length}</div><div class="lbl">Reading urinish</div></div>`));
  stats.appendChild(el(`<div class="card stat"><div class="n">${bandsBySection.listening.length}</div><div class="lbl">Listening urinish</div></div>`));
  stats.appendChild(el(`<div class="card stat"><div class="n">${bandsBySection.writing.length}</div><div class="lbl">Writing urinish</div></div>`));
  stats.appendChild(el(`<div class="card stat"><div class="n">${bandsBySection.speaking.length}</div><div class="lbl">Speaking urinish</div></div>`));
  wrap.appendChild(stats);

  const barsCard = document.createElement('div');
  barsCard.className='card';
  barsCard.style.padding='18px 20px';
  barsCard.appendChild(el(`<h3 style="margin:0 0 12px;font-size:14.5px;">Bo'limlar bo'yicha o'rtacha band</h3>`));
  ['reading','listening','writing','speaking'].forEach(sec=>{
    const a = avg(bandsBySection[sec]);
    const pct = a? (a/9*100):0;
    barsCard.appendChild(el(`
      <div class="bar-row">
        <span class="blbl">${SECTION_LABEL[sec]}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;"></div></div>
        <span class="bar-val">${a?a.toFixed(1):'—'}</span>
      </div>
    `));
  });
  wrap.appendChild(barsCard);

  const histCard = document.createElement('div');
  histCard.className='card';
  histCard.style.padding='18px 20px';
  histCard.style.marginTop='16px';
  histCard.appendChild(el(`<h3 style="margin:0 0 8px;font-size:14.5px;">Urinishlar tarixi</h3>`));
  if(attempts.length===0){
    histCard.appendChild(el(`<div class="empty">Hali natija yo'q. Mashqlarni bajaring va bu yerda ko'rinadi.</div>`));
  } else {
    const tbl = document.createElement('table');
    tbl.className='hist';
    tbl.innerHTML = `<tr><th>Sana</th><th>Bo'lim</th><th>Mashq</th><th>Natija</th></tr>` +
      attempts.slice(0,60).map(a=>`
        <tr>
          <td>${new Date(a.date).toLocaleDateString('uz-UZ')}</td>
          <td>${SECTION_LABEL[a.section]||a.section}${a.isMock?' <span class="mockbadge" style="font-size:9.5px;padding:1px 6px;">MOCK</span>':''}</td>
          <td>${escapeHtml(a.examTitle||'')}</td>
          <td>${a.band!=null? 'Band '+a.band : (a.correct+'/'+a.total)}${a.timeSec ? ' · ⏱ '+fmtDur(a.timeSec) : ''}</td>
        </tr>
      `).join('');
    histCard.appendChild(tbl);
  }
  wrap.appendChild(histCard);
  return wrap;
}

    if(mockCreditsLeft()>0){
