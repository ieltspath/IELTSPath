<style>
/* ============ TOKENS ============ */
:root{
  --bg:#080a16;
  --bg-2:#0d1024;
  --navy:#0b0d1d;
  --navy-2:#141833;
  --paper:#11142a;
  --card: rgba(255,255,255,0.055);
  --card-solid:#141833;
  --ink:#F4F5FC;
  --ink-soft:#9AA1C4;
  --line: rgba(255,255,255,0.11);
  --accent-a:#7C6CFF;
  --accent-b:#3FCBFF;
  --accent-c:#FF6F91;
  --accent-d:#FFB648;
  --stamp:#FF6F91;
  --gold:#FFB648;
  --gold-soft: rgba(255,182,72,0.16);
  --ok:#3ddc97;
  --shadow: 0 14px 34px rgba(2,4,16,0.45);
  --radius: 16px;
  --sidebar-w: 236px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans", -apple-system, "Segoe UI", sans-serif;
  min-height:100vh;
}
h1,h2,h3,.serif{ font-family:inherit; font-weight:800; letter-spacing:-0.01em; }
button{ font-family:inherit; color:inherit; }
a{ color:inherit; }
::selection{ background: var(--gold-soft); }

/* focus visibility */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent-b);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ============ AURORA BACKGROUND ============ */
.aurora-bg{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:var(--bg);
}
.aurora-bg span{
  position:absolute; border-radius:50%; filter:blur(70px); opacity:0.55;
  mix-blend-mode:screen;
}
.aurora-bg span:nth-child(1){
  width:52vw; height:52vw; top:-18vw; left:-12vw;
  background:radial-gradient(circle at 30% 30%, var(--accent-a), transparent 70%);
  animation: auroraDrift1 26s ease-in-out infinite;
}
.aurora-bg span:nth-child(2){
  width:46vw; height:46vw; top:10vh; right:-16vw;
  background:radial-gradient(circle at 60% 40%, var(--accent-b), transparent 70%);
  animation: auroraDrift2 32s ease-in-out infinite;
}
.aurora-bg span:nth-child(3){
  width:40vw; height:40vw; bottom:-16vw; left:18vw;
  background:radial-gradient(circle at 50% 50%, var(--accent-c), transparent 70%);
  animation: auroraDrift3 30s ease-in-out infinite;
}
.aurora-bg span:nth-child(4){
  width:34vw; height:34vw; bottom:6vh; right:8vw;
  background:radial-gradient(circle at 50% 50%, var(--accent-d), transparent 70%);
  animation: auroraDrift1 22s ease-in-out infinite reverse;
}
@keyframes auroraDrift1{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(6vw,4vh) scale(1.12); }
}
@keyframes auroraDrift2{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-5vw,6vh) scale(1.08); }
}
@keyframes auroraDrift3{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(4vw,-5vh) scale(1.1); }
}

/* ============ LAYOUT ============ */
#app{ display:flex; min-height:100vh; position:relative; z-index:1; }

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg, var(--navy-2), var(--navy));
  color:#EDF0F6;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  border-right:1px solid var(--line);
}
.brand-row{
  display:flex; align-items:center; gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid var(--line);
}
.brand-name{
  font-weight:800;
  font-size:22px;
  letter-spacing:-0.01em;
  background:linear-gradient(120deg, var(--accent-b), var(--accent-a) 55%, var(--accent-c));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.admin-plus{
  width:28px; height:28px;
  border-radius:50%;
  background:linear-gradient(135deg, var(--accent-c), var(--accent-d));
  color:#1a0f10;
  border:none;
  font-size:17px;
  font-weight:700;
  line-height:1;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow: 0 4px 14px rgba(255,111,145,0.35);
}
.admin-plus:hover{ filter:brightness(1.08); }
.admin-tag{
  font-size:10px; font-weight:700; letter-spacing:0.06em;
  color: var(--gold);
  margin-left:auto;
}

nav.mainnav{ padding:14px 10px; flex:1; overflow-y:auto; }
nav.mainnav .navlink{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px;
  border-radius:12px;
  color:#B7BEDE;
  text-decoration:none;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:3px;
  border:1px solid transparent;
  background:none;
  width:100%;
  text-align:left;
  transition:background .15s ease, color .15s ease;
}
nav.mainnav .navlink .ic{ width:18px; text-align:center; opacity:0.9; font-size:15px; }
nav.mainnav .navlink:hover{ background:rgba(255,255,255,0.06); color:#fff; }
nav.mainnav .navlink.active{
  background:linear-gradient(120deg, rgba(124,108,255,0.28), rgba(63,203,255,0.22));
  color:#fff;
  border-color:rgba(255,255,255,0.14);
  box-shadow: inset 3px 0 0 var(--accent-b);
}
.sidebar-foot{
  padding:14px 20px 18px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:#8b93b8;
}
.sidebar-foot .who{ color:#dfe4ef; font-weight:700; display:block; margin-bottom:2px;}

.main{ flex:1; min-width:0; padding:30px 34px 60px; max-width:1040px; position:relative; z-index:1; }
.pagehead{ margin-bottom:22px; }
.pagehead h1{ margin:0 0 4px; font-size:27px; font-weight:800; }
.pagehead p{ margin:0; color:var(--ink-soft); font-size:14.5px; max-width:62ch; }

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

/* ============ MOBILE TOPBAR ============ */
.topbar{ display:none; }
@media (max-width: 880px){
  .sidebar{ position:fixed; left:0; top:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .18s ease; }
  .sidebar.open{ transform:translateX(0); }
  .topbar{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    background:linear-gradient(120deg, var(--navy-2), var(--navy)); color:#fff;
    position:sticky; top:0; z-index:30;
    border-bottom:1px solid var(--line);
  }
  .topbar .burger{ background:none;border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;width:34px;height:34px;font-size:16px; cursor:pointer;}
  .topbar .tbname{ font-weight:800; font-size:18px; }
  .scrim{ display:none; }
  .scrim.show{ display:block; position:fixed; inset:0; background:rgba(4,6,16,0.55); z-index:35; }
  .main{ padding:20px 16px 50px; }
  #app{ display:block; }
  .row2{ grid-template-columns:1fr; }
  .stat-grid{ grid-template-columns:repeat(2,1fr); }
  .modal{ padding:20px 16px 18px; }
  .modal-scrim{ padding:16px 10px; align-items:center; }
  .auth-card{ padding:26px 20px; max-width:100%; }
  .detail-card{ padding:16px 14px; }
  .exrow{ flex-wrap:wrap; }
  table.hist{ font-size:12px; }
  .chat-bubble{ max-width:96%; }
}
html, body{ overflow-x:hidden; max-width:100%; }
img, video, iframe{ max-width:100%; }

/* ============ HOME GRID ============ */
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:6px; }
.tile{
  padding:20px 18px;
  cursor:pointer;
  display:flex; flex-direction:column; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.tile:hover{ transform:translateY(-2px); box-shadow:0 18px 40px rgba(2,4,16,0.5); }
.tile .ticon{ font-size:22px; }
.tile h3{ margin:0; font-size:17px; }
.tile p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.45;}
.tile .count{ margin-top:auto; font-size:12px; color:var(--gold); font-weight:700; }

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 18px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font-size:13.5px; font-weight:700;
  cursor:pointer;
  backdrop-filter: blur(12px);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{ transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn-primary{
  background:linear-gradient(120deg, var(--accent-a), var(--accent-b));
  color:#0a0d1d; border-color:transparent;
  box-shadow: 0 8px 22px rgba(124,108,255,0.35);
}
.btn-primary:hover{ filter:brightness(1.06); }
.btn-gold{ background:linear-gradient(120deg, var(--accent-d), var(--accent-c)); color:#2a1206; border-color:transparent; box-shadow:0 8px 22px rgba(255,182,72,0.3); }
.btn-ghost{ background:transparent; box-shadow:none; backdrop-filter:none; }
.btn:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
.btn-sm{ padding:6px 13px; font-size:12.5px; }

/* ============ FORM ============ */
label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
input[type=text], input[type=tel], input[type=number], textarea, select{
  width:100%;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  color:var(--ink);
  font-size:14px;
  font-family:inherit;
}
input::placeholder, textarea::placeholder{ color:#6b729a; }
textarea{ resize:vertical; min-height:110px; line-height:1.5; }
.field{ margin-bottom:14px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.seg{ display:flex; gap:6px; flex-wrap:wrap; }
.seg button{
  padding:8px 15px; border-radius:999px; border:1px solid var(--line);
  background:rgba(255,255,255,0.04); color:var(--ink-soft); font-size:13px; font-weight:700; cursor:pointer;
  transition:background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
}
.seg button.on{ background:linear-gradient(120deg, var(--accent-a), var(--accent-b)); color:#0a0d1d; border-color:transparent; transform:scale(1.04); }
.seg button:disabled{ cursor:default; opacity:0.85; }

/* ============ MODAL ============ */
.modal-scrim{ position:fixed; inset:0; background:rgba(4,6,16,0.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; backdrop-filter:blur(4px); }
.modal{ background:var(--card-solid); border-radius:20px; width:100%; max-width:520px; padding:24px 24px 22px; border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,0.5); }
.modal h2{ margin:0 0 4px; font-size:19px; }
.modal .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 18px; }
.modal-close{ float:right; background:none; border:none; font-size:19px; cursor:pointer; color:var(--ink-soft); }

/* ============ LIST / EXERCISE ITEMS ============ */
.list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
.exrow{
  display:flex; align-items:center; gap:14px;
  padding:14px 16px;
  cursor:pointer;
}
.exrow .tag{
  font-size:11px; font-weight:700; letter-spacing:0.02em;
  padding:4px 10px; border-radius:20px;
  background:var(--gold-soft); color:var(--gold);
  flex-shrink:0;
}
.exrow .ttl{ font-weight:700; font-size:14.5px; }
.exrow .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px;}
.exrow .go{ margin-left:auto; color:var(--ink-soft); font-size:13px; }
.exrow:hover{ background:rgba(255,255,255,0.05); }
.empty{ padding:30px 18px; text-align:center; color:var(--ink-soft); font-size:13.5px; }

.tabs{ display:flex; gap:4px; margin:16px 0 4px; border-bottom:1px solid var(--line); }
.tabs button{ background:none; border:none; padding:9px 14px; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabs button.on{ color:var(--ink); border-color:var(--accent-b); }

.mockbadge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:#fff; background:linear-gradient(120deg, var(--accent-c), var(--accent-a)); padding:4px 10px; border-radius:20px; }

/* ============ EXERCISE DETAIL ============ */
.backlink{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); background:none; border:none; cursor:pointer; margin-bottom:14px; padding:0;}
.backlink:hover{ color:var(--ink); }
.back-fab{ display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:20px; line-height:1; cursor:pointer; margin:0 0 14px; padding:0; box-shadow:var(--shadow); }
.back-fab:hover{ border-color:var(--accent-b); }
.main.has-fab .backlink{ display:none; }
.sp-qrow{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.sp-qrow input{ flex:1; }
.detail-card{ padding:22px 24px; }
.audio-wrap audio{ width:100%; margin-top:10px; }
.file-link{ display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border:1px solid var(--line); border-radius:999px; margin-top:10px; font-size:13.5px; font-weight:700; text-decoration:none; }
.file-link:hover{ background:rgba(255,255,255,0.06); }

/* ============ MATERIAL VIEWER (ENLARGE) ============ */
.mat-toolbar{ display:flex; justify-content:flex-end; }
.mat-expand-btn{
  background:rgba(255,255,255,0.06); border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; font-size:12.5px; font-weight:700; color:var(--ink-soft);
  cursor:pointer;
}
.mat-expand-btn:hover{ background:rgba(255,255,255,0.1); color:var(--ink); }
.mat-wrap.maximized{
  position:fixed; inset:0; z-index:60; background:var(--bg);
  padding:14px 16px 18px; overflow-y:auto; display:flex; flex-direction:column;
}
.mat-wrap.maximized .mat-frame-wrap{ flex:1; display:flex; flex-direction:column; min-height:0; }
.mat-wrap.maximized .mat-frame{ flex:1; height:auto !important; min-height:0; }
.mat-wrap.maximized .mat-expand-btn{ background:linear-gradient(120deg, var(--accent-a), var(--accent-b)); color:#0a0d1d; border-color:transparent; }
@media (max-width:600px){
  .mat-wrap.maximized{ padding:10px 10px 14px; }
}

.del-btn{
  background:none; border:1px solid var(--line); border-radius:10px;
  width:32px; height:32px; flex-shrink:0; cursor:pointer;
  font-size:14px; color:var(--ink-soft);
}
.del-btn:hover{ background:rgba(255,111,145,0.16); border-color:rgba(255,111,145,0.4); color:#ff8fa8; }
.divider{ height:1px; background:var(--line); margin:20px 0; }
.band-pill{ display:inline-flex; align-items:baseline; gap:5px; background:var(--gold-soft); color:var(--gold); padding:8px 18px; border-radius:999px; font-weight:800; }
.band-pill b{ font-size:26px; }
.band-pill span{ font-size:12px; opacity:0.85;}

/* ============ AI PANEL ============ */
.ai-box{ background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:14px; white-space:pre-wrap; font-size:14px; line-height:1.6; }
.thinking{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:13.5px; }
.dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulse 1s infinite ease-in-out; }
.dot:nth-child(2){ animation-delay:0.15s; } .dot:nth-child(3){ animation-delay:0.3s; }
@keyframes pulse{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

/* ============ PROGRESS ============ */
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px;}
.stat{ padding:16px 18px; }
.stat .n{ font-size:28px; font-weight:800; color:var(--ink); }
.stat .lbl{ font-size:12px; color:var(--ink-soft); margin-top:2px;}
.bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.bar-row .blbl{ width:74px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); }
.bar-track{ flex:1; height:9px; background:rgba(255,255,255,0.06); border-radius:5px; overflow:hidden; border:1px solid var(--line); }
.bar-fill{ height:100%; background:linear-gradient(90deg, var(--accent-a), var(--accent-b)); }
.bar-val{ width:30px; text-align:right; font-size:12.5px; font-weight:700; flex-shrink:0; }
table.hist{ width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
table.hist th{ text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:700; padding:6px 10px; border-bottom:1px solid var(--line);}
table.hist td{ padding:9px 10px; border-bottom:1px solid var(--line); }
table.hist tr:last-child td{ border-bottom:none; }

/* ============ AUTH SCREEN ============ */
.auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; z-index:1; }
.auth-card{ background:var(--card-solid); border-radius:22px; padding:36px 32px; width:100%; max-width:400px; box-shadow:0 24px 60px rgba(0,0,0,0.5); border:1px solid var(--line); }
.auth-logo{ font-weight:800; font-size:25px; margin-bottom:4px; background:linear-gradient(120deg, var(--accent-b), var(--accent-a) 55%, var(--accent-c)); -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block; }
.auth-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 24px; }
.err{ color:var(--accent-c); font-size:12.5px; margin-top:6px; }

/* ============ SPEAKING ============ */
.chip{ display:inline-block; padding:7px 15px; border:1px solid var(--line); border-radius:999px; font-size:13px; cursor:pointer; margin:0 6px 6px 0; background:rgba(255,255,255,0.04); }
.chip:hover{ background:rgba(255,255,255,0.08); }
.chat-bubble{ padding:12px 16px; border-radius:16px; margin-bottom:10px; font-size:14px; line-height:1.55; max-width:88%; }
.chat-bubble.ai{ background:rgba(255,255,255,0.05); border:1px solid var(--line); }
.chat-bubble.me{ background:linear-gradient(120deg, var(--accent-a), var(--accent-b)); color:#0a0d1d; margin-left:auto; font-weight:600; }

.ex-av{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,0.06);border:1px solid var(--line);transition:.2s;flex:none;}
.ex-av.on{box-shadow:0 0 0 6px rgba(124,140,255,.18),0 0 0 12px rgba(124,140,255,.08);animation:exp 1.2s ease-in-out infinite;}
@keyframes exp{50%{transform:scale(1.07);}}

const TABLE_NAME_MAP = { speakingQuestions: 'speaking_questions' };

const FIELD_MAPS = {
  exercises: { assetId:'asset_id', assetUrl:'asset_url', assetType:'asset_type', contentKind:'content_kind', totalQuestions:'total_questions', mockId:'mock_id', promptText:'prompt_text', createdAt:'created_at' },

function toDbRow(collectionName, obj){
  const map = FIELD_MAPS[collectionName] || {};
  const row = {};
  for(const k in obj){ row[map[k] || k] = obj[k]; }
  return row;
}
function fromDbRow(collectionName, row){
  if(!row) return row;
  const map = FIELD_MAPS[collectionName] || {};
  const reverse = {};
  for(const k in map) reverse[map[k]] = k;
  const obj = {};
  for(const k in row){ obj[reverse[k] || k] = row[k]; }
  return obj;
}
// Avvalgi Claude-only "db" capability bilan bir xil .collection()/.doc() ko'rinishini
// taqdim etuvchi ustyapma — shu tufayli qolgan butun kod o'zgarishsiz ishlayveradi.
function createSupabaseDb(sb){
  function docRef(path){
    const idx = path.indexOf('/');
    const collectionName = path.slice(0, idx);
    const id = path.slice(idx+1);
    const table = TABLE_NAME_MAP[collectionName] || collectionName;
    const pk = PRIMARY_KEY_MAP[collectionName] || 'id';
    return {
      async get(){
        const { data, error } = await sb.from(table).select('*').eq(pk, id).maybeSingle();
        if(error) throw error;
        return { exists: !!data, data: ()=>fromDbRow(collectionName, data) };
      },
      async set(obj){
        const row = toDbRow(collectionName, obj);
        row[pk] = id;
        const { error } = await sb.from(table).upsert(row, { onConflict: pk });
        if(error) throw error;
      },
      async delete(){
        const { error } = await sb.from(table).delete().eq(pk, id);
        if(error) throw error;
      },
      onSnapshot(cb, errCb){
        const self = this;
        self.get().then(cb).catch(e=>{ if(errCb) errCb(e); });
        try{
          sb.channel('rt-doc-'+table+'-'+id+'-'+Math.random().toString(36).slice(2))
            .on('postgres_changes', {event:'*', schema:'public', table, filter: pk+'=eq.'+id}, ()=>{ self.get().then(cb).catch(()=>{}); })
            .subscribe();
        }catch(e){ if(errCb) errCb(e); }
      }
    };
  }
  function collectionRef(collectionName){
    const table = TABLE_NAME_MAP[collectionName] || collectionName;
    const filters = [];
    let orderField = null, orderDesc = false;
    const api = {
      where(field, op, value){
        filters.push([(FIELD_MAPS[collectionName]||{})[field] || field, value]);
        return api;
      },
      orderBy(field, dir){
        orderField = (FIELD_MAPS[collectionName]||{})[field] || field;
        orderDesc = dir==='desc';
        return api;
      },
      async get(){
        let q = sb.from(table).select('*');
        filters.forEach(([f,v])=>{ q = q.eq(f,v); });
        if(orderField) q = q.order(orderField, { ascending: !orderDesc });
        const { data, error } = await q;
        if(error) throw error;
        return { docs: (data||[]).map(row=>({ data:()=>fromDbRow(collectionName,row) })) };
      },
      onSnapshot(cb, errCb){
        api.get().then(cb).catch(e=>{ if(errCb) errCb(e); });
        try{
          sb.channel('rt-'+table+'-'+Math.random().toString(36).slice(2))
            .on('postgres_changes', {event:'*', schema:'public', table}, ()=>{
              api.get().then(cb).catch(()=>{});
            })
            .subscribe();
        }catch(e){ if(errCb) errCb(e); }
      }
    };
    return api;
  }
  return { doc: docRef, collection: collectionRef };
}
// "assets" capability o'rnini bosuvchi — Supabase Storage'dagi "assets" bucket'iga yuklaydi.
function createSupabaseAssets(sb){
  return {
    async upload(file, options){
      const id = 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
      const contentType = (options&&options.type) || file.type || 'application/octet-stream';
      const extGuess = (contentType.split('/')[1]||'bin').split(';')[0].replace('+xml','');
      const path = id+'.'+extGuess;
      const body = (file instanceof Blob) ? await file.arrayBuffer() : file;
      const { error } = await sb.storage.from('assets').upload(path, body, { contentType, upsert:false });
      if(error) throw { code:'upload_failed', message: error.message };
      const { data } = sb.storage.from('assets').getPublicUrl(path);
      return { id: path, url: data.publicUrl, contentType };
    },
    async delete(id){
      if(!id) return;
      try{ await sb.storage.from('assets').remove([id]); }catch(e){}
    }
  };
}
// "sample" (AI) capability o'rnini bosuvchi — Gemini'ni Edge Function orqali chaqiradi.
function createGeminiSample(){
  return async function sample(prompt, options){
    let lastErr = '', noText = false;
    const MAX_TRIES = 4;
    for(let attempt=0; attempt<MAX_TRIES; attempt++){
      try{
        const res = await fetch(AI_FUNCTION_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ prompt: prompt + langInstr() })
        });
        const raw = await res.text();
        let data = null; try{ data = JSON.parse(raw); }catch(e){}
        if(data && data.text){
          const text = data.text;
          if(options && options.onText) options.onText({ text });
          return { text };
        }
        const apiErr = data && data.error ? (typeof data.error==='string' ? data.error : (data.error.message || JSON.stringify(data.error))) : '';
        lastErr = 'HTTP '+res.status+(apiErr ? ' — '+apiErr : (raw ? ' — '+raw.slice(0,140) : ''));
        noText = !!(res.ok && data);
        if([400,401,403,404].includes(res.status) && !/demand|overload|unavailable|quota|try again/i.test(lastErr)) break;   // haqiqiy 4xx: qayta urinish foydasiz
      }catch(e){ lastErr = 'Tarmoq xatosi: '+((e && e.message) || e); noText = false; }
      if(attempt<MAX_TRIES-1) await new Promise(r=>setTimeout(r, 1500*(attempt+1)+Math.random()*500));   // 1.5s, 3s, 4.5s ...
    }
    try{ window.__aiLastError = lastErr; console.error('AI xatosi:', lastErr); }catch(e){}
    const text = noText ? 'Javob olinmadi.' : 'AI xizmatida xatolik yuz berdi. Birozdan so\'ng qayta urinib ko\'ring.';
    if(options && options.onText) options.onText({ text });
    return { text, error: lastErr };
  };
}

/* ============ KUNLIK REJA MATNINI TARJIMA QILISH (AI orqali, keshlanadi) ============ */
// Reja matnlari kodda o'zbekcha yoziladi, shuning uchun lug'at ularni tarjima qila olmaydi.
// Til EN/RU bo'lsa, reja matnlari AI orqali tarjima qilinadi va brauzerda saqlanadi (keyingi safar tezroq).
const PLAN_TR_KEY = 'ielts_plan_tr_v1';
let planTrCache = {}; try{ planTrCache = JSON.parse(localStorage.getItem(PLAN_TR_KEY)||'{}') || {}; }catch(e){ planTrCache = {}; }
const planTrWait = new Map(); let planTrTimer = null, planTrBusy = false, planTrFailUntil = 0;
function planTrNode(n, t){
  const key = state.lang+'|'+t;
  if(!/[A-Za-z\u0400-\u04FF]{3}/.test(t)) return;
  const hit = planTrCache[key];
  if(hit){ n.__ptr = hit; n.nodeValue = n.nodeValue.replace(t, ()=>hit); return; }
  if(!planTrWait.has(t)) planTrWait.set(t, []);
  planTrWait.get(t).push(n);
  clearTimeout(planTrTimer); planTrTimer = setTimeout(planTrFlush, 300);
}
async function planTrFlush(){
  if(planTrBusy || !state.sample || Date.now()<planTrFailUntil || !planTrWait.size) return;
  planTrBusy = true;
  const lang = state.lang;
  try{
    while(planTrWait.size && state.lang===lang){
      const keys = Array.from(planTrWait.keys()).slice(0,25);
      const prompt = 'Translate every Uzbek string in the JSON array below into '+(lang==='en'?'English':'Russian')+'. Keep emoji, numbers, symbols, English IELTS terms (Reading, Listening, Passage, True/False/Not Given, Band...) and « » quotes unchanged; if a string is already in the target language return it unchanged. Return ONLY a JSON array of strings with exactly '+keys.length+' items in the same order — no markdown, no comments.\n'+JSON.stringify(keys);
      const res = await state.sample(prompt, {modelTier:'default'});
      let arr = null;
      try{ const m = (res && res.text || '').match(/\[[\s\S]*\]/); arr = m ? JSON.parse(m[0]) : null; }catch(e){}
      if(!Array.isArray(arr) || arr.length!==keys.length || res.error){ planTrFailUntil = Date.now()+60000; break; }
      i18nObserver.disconnect();
      keys.forEach((k,i)=>{
        const v = (typeof arr[i]==='string' && arr[i].trim()) ? arr[i] : k;
        planTrCache[lang+'|'+k] = v;
        (planTrWait.get(k)||[]).forEach(nd=>{ if(nd.isConnected && state.lang===lang){ nd.__ptr = v; nd.nodeValue = nd.nodeValue.replace(k, ()=>v); } });
        planTrWait.delete(k);
      });
      i18nStart();
      try{ localStorage.setItem(PLAN_TR_KEY, JSON.stringify(planTrCache)); }catch(e){}
    }
  }catch(e){ planTrFailUntil = Date.now()+60000; }
  planTrBusy = false;
}

function tr(str){
  const lang = state.lang;
  if(!lang || lang==='uz' || !str) return str;
  const idx = lang==='en' ? 0 : 1;
  const hit = I18N_DICT[str];
  if(hit) return hit[idx];
  let s = str;
  ['1-bosqich: Asos','2-bosqich: Amaliyot','3-bosqich: Imtihon oldi'].forEach(k=>{ if(s.indexOf(k)>-1) s = s.split(k).join(I18N_DICT[k][idx]); });
  for(const p of I18N_PATTERNS){ s = s.replace(p[0], p[1+idx]); }
  return s;
}
const I18N_SKIP = {SCRIPT:1, STYLE:1, TEXTAREA:1, CODE:1, PRE:1};
function i18nAttrs(n){
  ['placeholder','title','aria-label'].forEach(a=>{
    if(n.hasAttribute && n.hasAttribute(a)){
      const v = n.getAttribute(a), o = tr(v);
      if(o!==v) n.setAttribute(a, o);
    }
  });
}
function i18nNode(n){
  if(n.nodeType===3){
    const p = n.parentElement;
    if(!p || I18N_SKIP[p.tagName]) return;
    const raw = n.nodeValue, t = raw.trim();
    if(!t) return;
    if(n.__ptr && n.__ptr===t) return;
    const out = tr(t);
    if(out!==t) n.nodeValue = raw.replace(t, ()=>out);
    else if(state.lang && state.lang!=='uz' && p.closest && p.closest('[data-plan]')) planTrNode(n, t);
  } else if(n.nodeType===1){
    i18nAttrs(n);
    if(I18N_SKIP[n.tagName]) return;
    n.childNodes.forEach(i18nNode);
  }
}
const i18nObserver = new MutationObserver(muts=>{
  if(!state.lang || state.lang==='uz') return;
  i18nObserver.disconnect();
  try{
    muts.forEach(m=>{
      if(m.type==='childList') m.addedNodes.forEach(i18nNode);
      else if(m.type==='characterData') i18nNode(m.target);
      else if(m.type==='attributes') i18nAttrs(m.target);
    });
  }catch(e){}
  i18nStart();
});
function i18nStart(){
  i18nObserver.observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['placeholder','title','aria-label']});
}
function applyLang(){

  // Sandbox (about:srcdoc) ichida window.fetch Headers/AbortSignal obyektlarini uzata olmaydi —
  // shuning uchun ularni oddiy obyektga aylantirib yuboramiz.
  const safeFetch = (input, init) => {
    if(input && typeof input !== 'string' && !(typeof Request!=='undefined' && input instanceof Request)) input = String(input);
    if(init){
      init = Object.assign({}, init);
      const h = init.headers;
      if(h){
        const plain = {};
        if(Array.isArray(h)) h.forEach(([k,v])=>{ plain[k]=v; });
        else if(typeof h.forEach==='function') h.forEach((v,k)=>{ plain[k]=v; });
        else Object.assign(plain, h);
        init.headers = plain;
      }
      delete init.signal;
    }
    return fetch(input, init);
  };
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { fetch: safeFetch } });
  const db = createSupabaseDb(sb);
  const assets = createSupabaseAssets(sb);
  const sample = createGeminiSample();
  state.db = db; state.assets = assets; state.sample = sample; state.sb = sb;

  if(state.user && state.user.isAdmin){
    if(!isAdminIdentity(state.user.familiya, state.user.ism, state.user.phone)){ state.user = null; try{ localStorage.removeItem('ielts_user'); }catch(e){} }
  }
  await refreshExercises();
  await refreshMocks();
  await refreshVocab();
  await refreshSpeakingQuestions();
  if(state.user){
    await refreshResults();
    await ensureWallet();
    if(state.user.isAdmin) await refreshAllWallets();
  }
  state.ready = true;
  render();

  if(db){
    try{
      db.collection('exercises').onSnapshot((snap)=>{
        state.exercises = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
        if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
      }, (err)=>{ /* subscription error: keep last known good state */ });
      db.collection('mocks').onSnapshot((snap)=>{
        state.mocks = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
        if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
      }, (err)=>{});
      db.collection('vocab').onSnapshot((snap)=>{
        state.vocab = ((snap && snap.docs) ? snap.docs.map(d=>d.data()) : []).map(normVocab);
        if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
      }, (err)=>{});
      db.collection('speakingQuestions').onSnapshot((snap)=>{
        state.speakingQuestions = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
        if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
      }, (err)=>{});
      if(state.user){
        const key = myPhoneKey();
        if(key){
          db.doc('wallets/'+key).onSnapshot((snap)=>{
            if(snap && snap.exists) state.wallet = snap.data();
            if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
          }, (err)=>{});
          db.collection('unlocks').where('phone','==',key).onSnapshot((snap)=>{
            state.unlocks = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
            if(state.mockPayOpen && state.mockPaySent && mockCreditsLeft()>0){ render(); return; }
            if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
          }, (err)=>{});
        }
        if(state.user.isAdmin){
          db.collection('payments').orderBy('createdAt','desc').onSnapshot((snap)=>{
            state.payments = (snap && snap.docs) ? snap.docs.map(d=>d.data()) : [];
            if(!state.modalOpen && !state.mockPayOpen && !state.busyRecording) render();
          }, (err)=>{});
        }
      }
    }catch(e){ /* onSnapshot unavailable; fallback already loaded via get() above */ }
  }
  startPolling();
}

  if(pollingStarted) return;

  // Mock to'lovi tasdiqlanishini kutayotgan foydalanuvchi uchun: tez-tez tekshiramiz
  setInterval(async ()=>{

    if(mockCreditsLeft()>0) return;
    await refreshMyUnlocks();

          }
        }
      }
    }catch(e){}
  }, 15000);
}
async function compressImageToDataUrl(file, maxDim, quality){
  let src, w, h, close=()=>{};
  try{
    const bmp = await createImageBitmap(file);
    src=bmp; w=bmp.width; h=bmp.height; close=()=>{ try{bmp.close();}catch(e){} };
  }catch(e1){
    src = await new Promise((resolve,reject)=>{
      const fr = new FileReader();
      fr.onerror=()=>reject(new Error("Rasmni o'qib bo'lmadi"));
      fr.onload=()=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.onerror=()=>reject(new Error("Rasmni o'qib bo'lmadi — JPG yoki PNG formatida yuklang"));
        img.src=fr.result;
      };
      fr.readAsDataURL(file);
    });
    w=src.naturalWidth; h=src.naturalHeight;
  }
  const sc = Math.min(1, maxDim/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(src,0,0,cw,ch);
  close();
  return c.toDataURL('image/jpeg', quality);
}

async function storeTaskImage(file){

    if(dataUrl.length > 1400000) dataUrl = await compressImageToDataUrl(file, 1200, 0.75);
  }catch(e){ console.warn('Rasm siqish xatosi:', e); }
  let blob = file, type = file.type || 'image/jpeg';
  if(dataUrl){ try{ blob = await (await fetch(dataUrl)).blob(); type = 'image/jpeg'; }catch(e){ blob = file; } }
  try{
    if(state.assets){
      const up = await state.assets.upload(blob, { type });
      if(up && up.url) return { id: up.id, url: up.url, contentType: type };
    }
  }catch(e){ console.warn('Task rasmi Storage xatosi, bazaga yoziladi:', e); }
  if(dataUrl) return { id: null, url: dataUrl, contentType: 'image/jpeg' };
  return null;
}

    if(r.status===401 || r.status===403 || /42501|row-level/i.test(t)) return "Server ishlayapti, lekin ruxsat yo'q (RLS) — payments_fix.sql ni ishga tushiring.";
    return 'Server javobi: HTTP '+r.status+' '+t.slice(0,160);

function normVocab(v){
  if(!v) return v;
  const o = {...v};
  if(typeof o.example==='string' && o.example.indexOf('@@')===0){

      const m = JSON.parse(o.example.slice(2));
      o.sec = m.s||''; o.kind = m.k||'word'; o.where = m.w||''; o.why = m.y||''; o.example = m.e||'';
    }catch(e){ o.example=''; }
  }
  return o;
}

async function maybeBundleMock(section){
  // Group unmocked exercises of this section
  const pool = state.exercises.filter(e=>e.section===section && !e.mockId);
  let group = null, title='';
  if(section==='listening'){
    if(pool.length>=4){
      group = pool.sort((a,b)=>a.createdAt-b.createdAt).slice(0,4);
      title = 'Listening Mock Test #'+(state.mocks.filter(m=>m.section==='listening').length+1);
    }
  } else if(section==='reading'){
    const p1 = pool.find(e=>e.subtype==='passage1');
    const p2 = pool.find(e=>e.subtype==='passage2');
    const p3 = pool.find(e=>e.subtype==='passage3');
    if(p1 && p2 && p3){
      group = [p1,p2,p3];
      title = 'Reading Mock Test #'+(state.mocks.filter(m=>m.section==='reading').length+1);
    }
  } else if(section==='writing'){
    const t1 = pool.find(e=>e.subtype==='task1');
    const t2 = pool.find(e=>e.subtype==='task2');
    if(t1 && t2){
      group = [t1,t2];
      title = 'Writing Mock Test #'+(state.mocks.filter(m=>m.section==='writing').length+1);
    }
  }
  if(group){
    const mockId = uid();
    const mockDoc = { id:mockId, section, title, examIds: group.map(g=>g.id), createdAt: Date.now() };
    try{
      await state.db.doc('mocks/'+mockId).set(mockDoc);
      for(const g of group){
        g.mockId = mockId;
        await state.db.doc('exercises/'+g.id).set(g);
      }
    }catch(e){}
    await refreshExercises();
    await refreshMocks();
    toast('Yangi mock test avtomatik yaratildi: '+title);
  }
}

/* ============ BAND CALC ============ */
function bandFromScore(correct, total){
  const scaled = Math.round((correct/total)*40);
  for(const [lo,hi,band] of READING_BANDS){
    if(scaled>=lo && scaled<=hi) return band;
  }
  return 2;
}

const SKILL_LABEL_UZ = {reading:'Reading', listening:'Listening', writing:'Writing', speaking:'Speaking'};

async function generateAIPlan(current, target, hours, examMonths, weakSkill){
  const fallback = buildDailyPlan(current, target, hours, examMonths, weakSkill);
  if(!state.sample) return fallback;
  const totalDays = Math.max(14, Math.round(examMonths*30));
  const prompt = `Siz IELTS bo'yicha professional, tajribali murabbiysiz. Talaba: hozirgi band ${current}, maqsad band ${target}, kuniga ${hours} soat vaqti bor, imtihongacha ${examMonths} oy (${totalDays} kun), eng zaif tomoni: ${SKILL_LABEL_UZ[weakSkill]}.
Vazifa: shu talaba uchun ANIQ, REAL va SHAXSIY reja tuzing. Agar ${hours} soat/kun bilan ${examMonths} oyda Band ${current} dan Band ${target} ga yetish REAL BO'LMASA, buni ochiq va halol ayting (masalan qancha ko'proq vaqt yoki muddat kerakligini aniq son bilan ko'rsating).
FAQAT quyidagi JSON formatida javob bering, boshqa hech qanday matn, izoh yoki markdown belgisi qo'shmang:
{"verdict":"1-3 gapli halol xulosa","phase1Days":<son>,"phase2Days":<son>,"phase3Days":<son>,"phase1Tasks":["...","...","...","...","...","..."],"phase2Tasks":["...","...","...","...","...","...","..."],"phase3Tasks":["...","...","...","...","...","..."]}
Shartlar: phase1Days+phase2Days+phase3Days yig'indisi aniq ${totalDays} ga teng bo'lsin. phase1Tasks kamida 6 ta (asoslarni mustahkamlash), phase2Tasks kamida 7 ta (jadal amaliyot, ${SKILL_LABEL_UZ[weakSkill]}ga alohida urg'u), phase3Tasks kamida 6 ta (faqat to'liq mock testlar va xato tahlili) — har biri bitta kunlik, konkret, amaliy vazifa bo'lsin.`;
  try{
    const res = await state.sample(prompt, {});
    let text = (res.text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
    const parsed = JSON.parse(text);
    if(!parsed.phase1Tasks || !parsed.phase2Tasks || !parsed.phase3Tasks) return fallback;
    return {
      availableWeeks: Math.round(totalDays/7),
      verdict: parsed.verdict || fallback.verdict,
      phase1Days: parsed.phase1Days || Math.round(totalDays*0.4),
      phase2Days: parsed.phase2Days || Math.round(totalDays*0.4),
      phase3Days: parsed.phase3Days || (totalDays - Math.round(totalDays*0.8)),
      phase1Tasks: parsed.phase1Tasks, phase2Tasks: parsed.phase2Tasks, phase3Tasks: parsed.phase3Tasks,
      isAI: true
    };
  }catch(e){ return fallback; }
}

function buildDailyPlan(current, target, hours, examMonths, weakSkill){
  const gapSteps = Math.max(1, Math.round((target-current)*2)); // 0.5 bandlik qadamlar
  const availableWeeks = Math.max(1, Math.round(examMonths*4.33));
  const hoursNeededTotal = gapSteps*55; // taxminan har 0.5 band uchun ~55 soat maqsadli mashq
  const hoursAvailable = availableWeeks*7*hours;
  const ratio = hoursAvailable/hoursNeededTotal;
  const weak = SKILL_LABEL_UZ[weakSkill] || 'Writing';

  let verdict;
  if(ratio>=1.3){
    verdict = `Sizda yetarlicha vaqt bor: taxminan ${hoursAvailable} soat ajratasiz, kerakli hajm esa ~${hoursNeededTotal} soat. Muntazam davom etsangiz, Band ${target} ga ${examMonths} oydan oldinroq ham yetishingiz mumkin.`;
  } else if(ratio>=1){
    verdict = `Reja real, lekin intizom talab qiladi: ~${hoursAvailable} soatingiz bor, kerak esa ~${hoursNeededTotal} soat. Hech qanday kunni o'tkazib yubormaslikka harakat qiling.`;
  } else if(ratio>=0.7){
    const suggestHours = hours+1;
    verdict = `Diqqat: hozirgi sur'atda (~${hoursAvailable} soat) Band ${target} ga ${examMonths} oyda yetish qiyin bo'lishi mumkin (kerak: ~${hoursNeededTotal} soat). Iloji bo'lsa kuniga ${suggestHours} soatga oshiring.`;
  } else {
    const neededMonths = Math.max(examMonths+1, Math.ceil(hoursNeededTotal/(hours*30)));
    const lowerTarget = Math.max(current+0.5, Math.round((target-0.5)*2)/2);
    verdict = `Ochig'ini aytsam: kuniga ${hours} soat bilan ${examMonths} oyda Band ${current} dan Band ${target} ga yetish katta ehtimol bilan yetarli emas (kerak: ~${hoursNeededTotal} soat, sizda ~${hoursAvailable} soat). Real variant: imtihonni ~${neededMonths} oyga surish, kuniga soatni oshirish, yoki hozircha Band ${lowerTarget} ni maqsad qilish.`;
  }

  let week;
  if(hours<=1){
    week = [
      `1-kun: ${weak} — 1 mashq (zaif tomoningiz, ko'proq e'tibor bering)`,
      "2-kun: Listening — 1 mashq",
      "3-kun: Reading — 1 passage",
      "4-kun: Writing — 1 topshiriq (AI tekshiradi va xatolarni ko'rsatadi)",
      "5-kun: Speaking — 1 mavzu (AI bilan amaliyot)",
      `6-kun: ${weak} — yana 1 mashq + oldingi xatolarni qayta ko'rib chiqish`,
      "7-kun: Yengil takrorlash yoki dam olish"
    ];
  } else if(hours===2){
    week = [
      `1-kun: ${weak} — 2 mashq`,
      "2-kun: Reading (1 passage) + Listening (1 mashq)",
      "3-kun: Writing Task 1 va Task 2 (AI baholaydi)",
      `4-kun: ${weak} — 2 mashq`,
      "5-kun: Speaking — 2 mavzu (AI bilan)",
      "6-kun: Reading yoki Listening mock (qisman)",
      "7-kun: Xatolar tahlili — AI tavsiyalarini qayta ko'rish"
    ];
  } else if(hours===3){
    week = [
      `1-kun: ${weak} — 2 mashq + Reading — 1 passage`,
      "2-kun: Listening — 2 mashq + Speaking — 1 mavzu",
      "3-kun: Writing Task 1 va Task 2 (AI baholaydi)",
      `4-kun: ${weak} — 2 mashq + Listening — 1 mashq`,
      "5-kun: Reading — 2 passage",
      "6-kun: To'liq mock test (bitta bo'lim) + AI tahlili",
      "7-kun: Xatolar ustida ishlash va takrorlash"
    ];
  } else {
    week = [
      `1-kun: Reading + Listening + ${weak} (qo'shimcha mashq) + Speaking`,
      "2-kun: Writing Task 1 va Task 2 (AI baholaydi) + Speaking amaliyoti",
      `3-kun: ${weak} — intensiv (3 mashq)`,
      "4-kun: To'liq Reading yoki Listening mock test",
      "5-kun: Speaking (AI bilan, 2 mavzu) + Writingni qayta yozish",
      "6-kun: To'liq mock test (barcha bo'lim)",
      "7-kun: Xatolar tahlili va zaif joylarni maqsadli mashq qilish"
    ];
  }

  const foundationTasks = [
    `${weak} — asosiy texnika va lug'atni o'rganish`,
    "Vocabulary bo'limidan 5 ta yangi ibora yodlash",
    `${weak} bo'yicha 1 ta oson mashq`,
    "Reading/Listening strategiyalarini o'rganish (skimming, scanning)",
    "Writing uchun bog'lovchi so'zlarni (linking words) mashq qilish",
    "Speaking — Part 1 savollariga tayyorgarlik ko'rish",
    "Yengil takrorlash"
  ];
  const finalTasks = [
    "To'liq mock test (Reading yoki Listening)",
    "Writing Task 1 va Task 2'ni vaqt bilan yozish",
    "Speaking — istalgan Part'dan savol tanlab, ovozda javob berish",
    "Oldingi xatolaringizni qayta ko'rib chiqish",
    "To'liq mock test (boshqa bo'lim)",
    `${weak}ga qo'shimcha e'tibor berish`,
    "Yengil takrorlash yoki dam olish"
  ];

  const totalDays = Math.max(14, Math.round(examMonths*30));
  const phase1Days = Math.round(totalDays*0.4);
  const phase2Days = Math.round(totalDays*0.4);
  const phase3Days = totalDays - phase1Days - phase2Days;

  return {
    availableWeeks, hoursNeededTotal, hoursAvailable, verdict,
    phase1Days, phase2Days, phase3Days,
    phase1Tasks: foundationTasks, phase2Tasks: week, phase3Tasks: finalTasks
  };
}

/* ===== Mashq taymeri ===== */
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), r = sec%60;
  const mm = String(m).padStart(h?2:1,'0'), ss = String(r).padStart(2,'0');
  return h ? h+':'+mm+':'+ss : mm+':'+ss;
}
function exStdMinutes(ex){
  if(ex.section==='writing') return ex.subtype==='task1' ? 20 : 40;
  if(ex.section==='reading') return ((ex.totalQuestions||0)>=30 || ex.isDirect) ? 60 : 20;
  if(ex.section==='listening') return ((ex.totalQuestions||0)>=30 || ex.isDirect) ? 30 : 10;
  return 60;
}
function stopExTimer(exId){
  const t = (state.timers||{})[exId];
  if(!t || t.mode!=='on') return null;
  if(!t.done){ t.elapsed = Date.now() - t.start; t.done = true; }
  return { sec: Math.round(t.elapsed/1000) };
}
function aiTimeLine(info){
  if(!info || !info.sec) return '';
  const m = Math.floor(info.sec/60), r = info.sec%60;
  return `\nTalaba bu mashqni ${m} daqiqa ${r} soniyada bajardi (imtihondagi me'yoriy vaqt: taxminan ${info.std} daqiqa). Javob oxirida alohida «⏱ Vaqt tahlili» bo'limi qo'shing: agar me'yordan ancha uzoq ishlagan bo'lsa (taxminan 25% dan ko'p) buni halol ayting, sababi nima bo'lishi mumkinligini (so'zlarni bilmaslik, ortiqcha o'ylash, savolga qayta-qayta qaytish, rejasiz yozish va h.k.) tushuntiring va tezlashtirish uchun 2 ta aniq mashq bering; me'yorga sig'gan bo'lsa buni qayd eting; juda tez bo'lsa, shoshilib xato qilmaganini tekshirishni tavsiya qiling.`;
}
function exTimerBar(ex){
  const t = (state.timers||{})[ex.id];
  if(!t || t.mode!=='on') return null;
  const bar = el(`<div class="card" style="position:sticky;top:8px;z-index:6;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;background:var(--card-solid);"><span style="font-size:22px;">⏱</span><div style="flex:1;"><div id="tm-label" style="font-size:11.5px;color:var(--ink-soft);font-weight:700;"></div><div id="tm-val" style="font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;"></div></div><button class="btn btn-sm" id="tm-reset" style="display:none;">↻ Yangi urinish</button></div>`);
  const lab = bar.querySelector('#tm-label'), val = bar.querySelector('#tm-val'), rb = bar.querySelector('#tm-reset');
  rb.onclick = ()=>{ delete state.timers[ex.id]; render(); };
  let iv = null;
  const upd = ()=>{
    if(t.done){
      val.textContent = fmtDur(t.elapsed/1000);
      lab.textContent = 'Ishlash vaqtingiz'; rb.style.display = '';
      if(iv){ clearInterval(iv); iv = null; }
    } else {
      val.textContent = fmtDur((Date.now()-t.start)/1000);
      lab.textContent = 'Taymer ishlayapti — natijani saqlaganingizda to\'xtaydi';
    }
  };
  upd();
  if(!t.done){
    iv = setInterval(()=>{ if(!bar.isConnected){ clearInterval(iv); iv = null; return; } upd(); }, 1000);
  }
  return bar;
}

async function aiCheckWriting(exId, taskType, promptTitle, essayText, onUpdate, timeInfo){
  if(!state.sample){ toast('AI xizmati mavjud emas'); return; }
  if(!(await chargeAiAnalysis())){ state.aiState[exId] = { loading:false, text:AI_DECLINE_TEXT }; if(onUpdate) onUpdate(); return; }
  state.aiState[exId] = { loading:true, text:'' };
  if(onUpdate) onUpdate();
  const instruction = `Siz tajribali IELTS Writing examinerisiz. Quyidagi ${taskType==='task1'?'Writing Task 1':'Writing Task 2'} insholarini rasman baholang.
Mavzu/topshiriq: ${promptTitle}${aiTimeLine(timeInfo)}
Talabaning matni:
"""
${essayText}
"""
Javobni faqat o'zbek tilida, quyidagi formatda bering:
1) Har bir mezon bo'yicha ball (Task Achievement/Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy) — har biriga alohida band (0-9, 0.5 qadam bilan).
2) Umumiy band ball (o'rtacha, 0.5 ga yaxlitlangan) — "UMUMIY BAND: X.X" formatida alohida qatorda yozing.
3) Asosiy xatolar ro'yxati (grammatika, so'z tanlash, tuzilma) — 4-6 ta aniq misol bilan, har bir xato uchun: "xato → to'g'ri varianti va nima uchun" formatida ko'rsating.
4) Yaxshilash uchun 3 ta amaliy tavsiya — har biri konkret harakat bo'lsin (masalan qaysi mavzuni mashq qilish, qaysi tuzilmani ishlatish kerak).
Qisqa va aniq yozing, ortiqcha maqtovsiz, halol baholang.`;
  try{
    const res = await state.sample(instruction, { onText:({text})=>{ state.aiState[exId] = {loading:true, text}; if(onUpdate) onUpdate(); }, modelTier:'default' });
    if(res && res.error){ await refundAiAnalysis(); }
    const finalText = res && res.text ? res.text : (state.aiState[exId] && state.aiState[exId].text) || '';
    state.aiState[exId] = { loading:false, text: finalText };
    if(onUpdate) onUpdate();
    const bandMatch = finalText.match(/UMUMIY BAND:\s*([\d.]+)/i);
    const band = bandMatch ? parseFloat(bandMatch[1]) : null;
    await saveResultAttempt({
      id: uid(), section:'writing', subtype:taskType, examId:exId, examTitle:promptTitle,
      isMock:false, mockId:null, band: band, wordCount: essayText.trim().split(/\s+/).length,
      timeSec: (timeInfo && timeInfo.sec) || null,
      date: Date.now()
    });
  }catch(e){
    state.aiState[exId] = { loading:false, text: 'AI tahlilida xatolik yuz berdi. Birozdan so\'ng qayta urinib ko\'ring.' };
    if(onUpdate) onUpdate();
  }
}

function fmPickSet(section){
  const exs = state.exercises.filter(e=>e.section===section);
  const bundled = state.mocks.filter(m=>m.section===section && !m.isDirect && m.examIds && m.examIds.length);
  if(bundled.length){
    const m = bundled[Math.floor(Math.random()*bundled.length)];
    const l = m.examIds.map(id=>exs.find(e=>e.id===id)).filter(Boolean);
    if(l.length) return l;
  }
  if(section==='reading') return ['passage1','passage2','passage3'].map(st=>shuf(exs.filter(e=>e.subtype===st))[0]).filter(Boolean);
  if(section==='writing') return ['task1','task2'].map(st=>shuf(exs.filter(e=>e.subtype===st))[0]).filter(Boolean);
  return exs.slice().sort((a,b)=>a.createdAt-b.createdAt).slice(0,4);
}
function fmSections(){
  const out = [];

  if((state.speakingQuestions||[]).length) out.push({key:'speaking', mins:FM_MINS.speaking, exs:[]});
  return out;
}
function ieltsRound(x){ const f=Math.floor(x), d=x-f; return d<0.25 ? f : d<0.75 ? f+0.5 : f+1; }
function cefrOf(b){ return b>=8.5?'C2' : b>=7?'C1' : b>=5.5?'B2' : b>=4?'B1' : b>=3?'A2' : 'A1'; }
function fmFmtTime(sec){ sec=Math.max(0,sec); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }

function fmStartSection(i){
  const s = FM.s, sec = s.secs[i];
  s.idx = i; s.endsAt = Date.now() + sec.mins*60000; s.ending = false; s.warned = false;
  const {bar, main} = fmShell(FM_NAMES[sec.key]+' · '+(i+1)+'/'+s.secs.length);
  const endBtn = el(`<button class="btn btn-sm">${T("Bo'limni tugatish","Finish section","Завершить раздел")}</button>`);
  endBtn.onclick = ()=>armConfirm(endBtn, ()=>fmEndSection(false), T("Ishonchingiz komilmi? (yana bosing)","Are you sure? (press again)","Вы уверены? (нажмите ещё раз)"));
  bar.insertBefore(endBtn, bar.querySelector('#fm-t'));
  endBtn.style.marginLeft = 'auto';
  if(sec.key==='writing') main.appendChild(fmWritingPane(sec));
  else if(sec.key==='speaking') main.appendChild(fmSpeakingPane());
  else main.appendChild(fmFramesPane(sec));
  clearInterval(FM.iv);
  const t = bar.querySelector('#fm-t');
  const tick = ()=>{
    const left = Math.round((s.endsAt-Date.now())/1000);
    t.textContent = '⏱ '+fmFmtTime(left); t.classList.toggle('low', left<=300);
    if(left<=300 && !s.warned){ s.warned = true; toast(T("5 daqiqa qoldi","5 minutes left","Осталось 5 минут")); }
    if(sec.key==='speaking' && state.examReport && !s.ending){ s.speakBand = state.examReport.band; fmEndSection(false); }
    if(left<=0 && !s.ending) fmEndSection(true);
  };
  tick(); FM.iv = setInterval(tick, 500);
}

  sec.exs.forEach((ex,k)=>{
    const label = sec.key==='listening' ? 'Part '+(k+1) : (SUBTYPE_LABEL[ex.subtype] || 'Passage '+(k+1));

    tb.onclick = ()=>{ panes.forEach((p,j)=>{ p.style.display = j===k?'block':'none'; }); Array.from(tabs.children).forEach((b,j)=>b.classList.toggle('btn-primary', j===k)); };
    tabs.appendChild(tb); panes.push(pane); wrap.appendChild(pane);
    if(ex.contentKind==='html' && ex.assetUrl){

async function fmEndSection(auto){
  const s = FM.s; if(!s || s.ending) return;
  s.ending = true; clearInterval(FM.iv); FM.iv = null;
  const sec = s.secs[s.idx];
  if(sec.key==='reading' || sec.key==='listening'){
    // vaqt tugadi — testlarni avtomatik yakunlashga urinamiz (Submit/Check)

      const d = fr.contentDocument; if(!d) return;
      const b = Array.from(d.querySelectorAll('button, input[type=button], input[type=submit], a')).find(x=>/submit|finish|check|grade|tekshir|yakun|topshir|заверш|провер/i.test((x.innerText||x.value||'')+' '+(x.id||'')));

      <p style="color:var(--ink-soft);font-size:14px;">${T('Keyingi bo\'lim','Next section','Следующий раздел')}: <b>${FM_NAMES[nxt.key]}</b> (${nxt.mins} ${T('daqiqa','min','мин')}). ${T("Oldingi bo'limga qaytib bo'lmaydi.","You cannot return to the previous section.","Вернуться в предыдущий раздел нельзя.")}</p>
      <button class="btn btn-primary" id="n-go" style="margin-top:10px;">${T('Boshlash','Start','Начать')} <span id="n-c">(10)</span></button></div></div>`);

async function fmFinish(){
  const s = FM.s;
  // 1) avtomatik aniqlanmagan Reading/Listening natijalari — qo'lda kiritiladi
  const missing = [];
  s.secs.forEach(sec=>{ if(sec.key==='reading'||sec.key==='listening') sec.exs.forEach(ex=>{ if(!s.res[ex.id]) missing.push(ex); }); });
  if(missing.length){
    await new Promise(resolve=>{
      const {main} = fmShell(T('Natijalarni tasdiqlang','Confirm your scores','Подтвердите результаты'));
      const w = el(`<div class="fm-wrap"><div class="card" style="padding:22px;"><h3 style="margin:0 0 6px;">${T("Ba'zi testlarning natijasi avtomatik aniqlanmadi","Some test scores were not detected automatically","Результаты некоторых тестов не определились автоматически")}</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">${T("To'g'ri javoblar sonini kiriting (bilmasangiz 0).","Enter the number of correct answers (0 if unknown).","Введите число правильных ответов (0, если не знаете).")}</p><div id="mm-rows"></div>
        <button class="btn btn-primary" id="mm-go" style="margin-top:12px;">${T('Davom etish','Continue','Продолжить')}</button></div></div>`);
      missing.forEach(ex=>{
        const tot = ex.totalQuestions || (ex.section==='listening' ? 10 : 13);
        w.querySelector('#mm-rows').appendChild(el(`<div class="field"><label>${FM_NAMES[ex.section]} — ${escapeHtml(ex.title)} (/${tot})</label><input type="number" min="0" max="${tot}" value="0" data-id="${ex.id}" data-t="${tot}"></div>`));
      });
      main.appendChild(w);
      w.querySelector('#mm-go').onclick = ()=>{
        w.querySelectorAll('input[data-id]').forEach(i=>{ const t = +i.dataset.t; s.res[i.dataset.id] = { c: Math.min(t, Math.max(0, parseInt(i.value)||0)), t }; });
        resolve();
      };
    });
  }
  // 2) Writing — AI baholaydi
  const {main} = fmShell(T('Natijalar hisoblanmoqda','Calculating results','Подсчёт результатов'));
  main.appendChild(el(`<div class="fm-wrap"><div class="card" style="padding:30px;text-align:center;"><div class="thinking" style="justify-content:center;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p style="color:var(--ink-soft);">${T('Writing AI tomonidan baholanmoqda...','Writing is being graded by AI...','Writing оценивается ИИ...')}</p></div></div>`));
  const wsec = s.secs.find(x=>x.key==='writing');
  let wBand = null, wText = '';
  if(wsec){
    const essays = wsec.exs.map(ex=>({ex, text:(s.wr[ex.id]||'').trim()}));
    if(essays.some(e=>e.text.split(/\s+/).length>=20) && state.sample && await chargeAiAnalysis()){
      const prompt = `You are an experienced IELTS Writing examiner. Grade the candidate's Task 1 and Task 2 strictly using the official band descriptors (Task Achievement/Response, Coherence & Cohesion, Lexical Resource, Grammatical Range & Accuracy).\n`+
        essays.map(e=>`### ${e.ex.subtype==='task1'?'TASK 1':'TASK 2'} prompt: ${e.ex.title}${e.ex.promptText?' — '+e.ex.promptText:''}\nEssay:\n"""\n${e.text||'(no answer)'}\n"""`).join('\n')+
        `\nFormat: for each task give 4 criterion bands and short feedback with 3-4 concrete mistakes (mistake → correction). Then write on separate lines exactly: "TASK1 BAND: X.X", "TASK2 BAND: X.X" (use 0 for a missing task), and finally "UMUMIY BAND: X.X" for overall Writing (Task 2 counts double). Be honest and concise.`;
      try{
        const res = await state.sample(prompt, {modelTier:'default'});
        if(res && res.error){ await refundAiAnalysis(); } else {
          wText = res.text || '';
          const m1 = wText.match(/TASK1 BAND:\s*([\d.]+)/i), m2 = wText.match(/TASK2 BAND:\s*([\d.]+)/i), mo = wText.match(/UMUMIY BAND:\s*([\d.]+)/i);
          if(m1 && m2){ wBand = ieltsRound((parseFloat(m1[1]) + 2*parseFloat(m2[1]))/3); }
          else if(mo){ wBand = parseFloat(mo[1]); }
        }
      }catch(e){ try{ await refundAiAnalysis(); }catch(_){} }
    }
  }
  // 3) Reading / Listening bandlari
  const rl = key=>{ const sec = s.secs.find(x=>x.key===key); if(!sec) return null;
    let c=0,t=0; sec.exs.forEach(ex=>{ const r = s.res[ex.id]; if(r){ c+=r.c; t+=r.t; } });
    return t ? bandFromScore(c,t) : null; };
  const bands = { listening: rl('listening'), reading: rl('reading'), writing: wBand, speaking: (s.speakBand!=null ? s.speakBand : null) };
  const have = Object.values(bands).filter(v=>v!=null);
  const overall = have.length ? ieltsRound(have.reduce((a,b)=>a+b,0)/have.length) : null;
  s.report = { bands, overall, wText, date:new Date() };
  if(overall!=null){ try{ await saveResultAttempt({ id:uid(), section:'full', subtype:null, examId:'fullmock', examTitle:'IELTS Mock', isMock:true, mockId:null, band:overall, date:Date.now() }, {silent:true}); }catch(e){} }
  document.removeEventListener('visibilitychange', fmOnVis);
  window.removeEventListener('beforeunload', fmBeforeUnload);
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  fmReport();
}

function fmReport(){
  const s = FM.s, r = s.report, i = s.info;
  const {bar, main} = fmShell(T('Natija','Result','Результат'));
  const t = bar.querySelector('#fm-t'); t.className=''; t.style.marginLeft='auto';
  const pr = el(`<button class="btn btn-sm fm-noprint">🖨 ${T('Chop etish / PDF','Print / PDF','Печать / PDF')}</button>`); pr.onclick = ()=>window.print();
  const cl = el(`<button class="btn btn-primary btn-sm fm-noprint" style="margin-left:8px;">${T('Yopish','Close','Закрыть')}</button>`); cl.onclick = fmClose;
  t.replaceWith(pr); pr.after(cl); pr.style.marginLeft='auto';
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const d = r.date, dstr = String(d.getDate()).padStart(2,'0')+'/'+MON[d.getMonth()]+'/'+d.getFullYear();
  const dob = i.dob ? (()=>{ const x=new Date(i.dob); return String(x.getDate()).padStart(2,'0')+'/'+MON[x.getMonth()]+'/'+x.getFullYear(); })() : '';
  const candNo = 'MOCK-'+String(d.getFullYear())+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(Math.floor(1000+Math.random()*9000));
  const v = x=> x==null ? '—' : (Number.isInteger(x) ? x.toFixed(1) : String(x));
  const bx = 'border:1px solid #9a9a9a;background:#f4f4f4;padding:6px 10px;min-height:30px;font-size:13px;display:flex;align-items:center;';
  const lab = 'font-size:12.5px;color:#222;';
  const entries = Object.entries(r.bands).filter(e=>e[1]!=null);
  const best = entries.slice().sort((a,b)=>b[1]-a[1])[0], worst = entries.slice().sort((a,b)=>a[1]-b[1])[0];

    <div style="font-size:11px;color:#444;margin:10px 0 14px;"><b>NOTE</b> ${T("Bu rasmiy imtihon emas — IELTS formatidagi mashq (mock) natijasi.","This is not an official exam — it is a practice (mock) result in IELTS format.","Это не официальный экзамен — результат тренировочного мока в формате IELTS.")}</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px;"><span style="${lab}">Date</span><div style="${bx}">${dstr}</div><span style="${lab}">Candidate Number</span><div style="${bx}">${candNo}</div></div>
    <div style="font-weight:800;font-size:14px;border-bottom:2px solid #333;padding-bottom:4px;margin-bottom:10px;">Candidate Details</div>
    <div style="display:flex;gap:16px;">
      <div style="flex:1;display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center;">
        <span style="${lab}">Family Name</span><div style="${bx}">${escapeHtml(i.fam)}</div>
        <span style="${lab}">First Name</span><div style="${bx}">${escapeHtml(i.ism)}</div>
        <span style="${lab}">Date of Birth</span><div style="${bx}">${dob}</div>
        <span style="${lab}">Sex (M/F)</span><div style="${bx}">${i.sex}</div>
        <span style="${lab}">Scheme Code</span><div style="${bx}">Mock (Practice)</div>
        <span style="${lab}">Country of Nationality</span><div style="${bx}">${escapeHtml(i.nat)}</div>
        <span style="${lab}">First Language</span><div style="${bx}">${escapeHtml(i.lang)}</div>
      </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      ${['listening','reading','writing','speaking'].map(k=>`<div style="text-align:center;"><div style="${lab}margin-bottom:3px;">${FM_NAMES[k]}</div><div style="${bx}justify-content:center;font-weight:800;font-size:17px;min-width:62px;">${v(r.bands[k])}</div></div>`).join('')}
      <div style="text-align:center;"><div style="${lab}margin-bottom:3px;">Overall Band Score</div><div style="${bx}justify-content:center;font-weight:900;font-size:22px;min-width:84px;background:#e6e6e6;">${v(r.overall)}</div></div>
      <div style="text-align:center;"><div style="${lab}margin-bottom:3px;">CEFR Level</div><div style="${bx}justify-content:center;font-weight:800;font-size:17px;min-width:62px;">${r.overall!=null?cefrOf(r.overall):'—'}</div></div>
    </div>
    <div style="margin-top:18px;"><div style="${lab}font-weight:700;margin-bottom:4px;">Administrator Comments</div>
      <div style="${bx}min-height:70px;align-items:flex-start;line-height:1.5;">${escapeHtml([comment, incomplete, blur].filter(Boolean).join(' '))}</div></div>

    <div style="margin-top:16px;font-size:10.5px;color:#555;text-align:center;border-top:1px solid #ccc;padding-top:8px;">IELTS MOCK — ${T("mashq natijasi, rasmiy hujjat emas.","practice result, not an official document.","тренировочный результат, не официальный документ.")}</div>

  </div>`);
  main.appendChild(wrap);
}

function App(){
  const root = document.getElementById('root');
  if(!state.user){
    root.innerHTML='';
    root.appendChild(AuthScreen());
    return;
  }
  root.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.id='app';
  wrap.appendChild(Sidebar());

  const mainWrap = document.createElement('div');
  mainWrap.style.flex='1'; mainWrap.style.minWidth='0'; mainWrap.style.display='flex'; mainWrap.style.flexDirection='column';
  mainWrap.appendChild(TopBar());
  const main = document.createElement('div');
  main.className='main';
  const _content = PageContent();
  if(state.page!=='home' || state.detail){
    main.classList.add('has-fab');
    const fab = el(`<button class="back-fab" type="button" title="Orqaga" aria-label="Orqaga">←</button>`);
    fab.onclick=()=>{
      const bl = main.querySelector('.backlink');
      if(bl){ bl.click(); return; }
      if(state.detail){ state.detail=null; render(); return; }
      state.page='home'; state.sectionTab='exercises'; render();
    };
    main.appendChild(fab);
  }
  main.appendChild(_content);
  mainWrap.appendChild(main);
  wrap.appendChild(mainWrap);

  if(state.sidebarOpen){
    const scrim = el(`<div class="scrim show"></div>`);
    scrim.onclick=()=>{ state.sidebarOpen=false; render(); };
    wrap.appendChild(scrim);
  }

  root.appendChild(wrap);

  if(state.modalOpen){
    root.appendChild(AddExerciseModal());
  }
  if(state.shopOpen){
    root.appendChild(CoinShopModal());
  }
  if(state.mockPayOpen){
    root.appendChild(MockPayModal());
  }
  if(planEndShouldShow()){
    root.appendChild(PlanEndModal());
  }
}

/* ===== Reja tugaganda: minnatdorchilik va motivatsiya xabari (ingliz tilida) ===== */
function planEnded(){
  const u = state.user;
  if(!u || u.isAdmin || !u.createdAt || !u.examMonths) return false;
  const totalDays = Math.max(14, Math.round(u.examMonths*30));
  const absDay = Math.floor((Date.now()-u.createdAt)/86400000);
  return absDay >= totalDays;
}
function planEndKey(){ const u=state.user; return 'ielts_plan_end_seen:'+(u?(u.phone||'')+':'+(u.createdAt||''):''); }
function planEndShouldShow(){
  if(!planEnded()) return false;
  try{ return !localStorage.getItem(planEndKey()); }catch(e){ return !state.planEndClosed; }
}
function PlanEndModal(){
  const u = state.user;
  const scrim = el(`<div class="modal-scrim" style="z-index:80;"></div>`);
  const name = escapeHtml(u.ism||'');
  const band = u.targetBand ? 'Band '+escapeHtml(String(u.targetBand)) : 'your target score';
  const modal = el(`
    <div class="modal" style="max-width:560px;text-align:center;border:1px solid rgba(124,108,255,0.55);">
      <div style="font-size:46px;line-height:1;">🎓</div>
      <h2 style="margin:10px 0 4px;font-size:23px;">Congratulations, ${name}!</h2>
      <div style="font-size:12px;font-weight:800;letter-spacing:0.08em;color:var(--accent-b);">YOUR STUDY PLAN IS COMPLETE</div>
      <div style="text-align:left;font-size:14.5px;line-height:1.7;margin-top:18px;">
        <p style="margin:0 0 12px;">Thank you for choosing us to be part of your IELTS journey. It truly means a lot to us that you trusted this platform with your preparation, day after day.</p>
        <p style="margin:0 0 12px;">Every practice test, every essay you rewrote, every new word you learned and every morning you showed up when you didn't feel like it — all of it has quietly built the skills you carry with you today. Real progress is rarely loud. It lives in the habits you created along the way.</p>
        <p style="margin:0 0 12px;">As your exam day approaches, remember this: you are far more prepared than you think. Nerves are simply energy looking for a direction, so let it work for you. Read each question carefully, manage your time calmly, take a deep breath, and trust the work you have already done.</p>
        <p style="margin:0 0 12px;">${band} is within your reach. Whatever the result on the day, the discipline, focus and courage you have built are yours to keep — and they will open doors long after the exam is over.</p>
        <p style="margin:0;">We believe in you. Walk into that room with confidence and show the examiner everything you are capable of. Good luck — we will be cheering for you every step of the way!</p>
      </div>
      <div style="margin-top:18px;font-weight:700;color:var(--ink-soft);font-size:13px;">— The IELTS Platform Team 💜</div>
      <button class="btn btn-primary" id="plan-end-ok" style="width:100%;justify-content:center;margin-top:20px;">Thank you — let's keep going</button>
    </div>
  `);
  modal.querySelector('#plan-end-ok').onclick=()=>{
    state.planEndClosed = true;
    try{ localStorage.setItem(planEndKey(), '1'); }catch(e){}
    render();

  scrim.appendChild(modal);

function AuthScreen(){
  if(!state.lang) return LangStep();
  const step = state.authStep;
  const d = state.authDraft;

  if(step===0.2){
    return AuthChoiceStep({
      title:T("IELTS sizga nima uchun kerak?","Why do you need IELTS?","Для чего вам нужен IELTS?"),
      sub:T("Maqsadingizni tanlang — rejani shunga moslaymiz.","Choose your goal — we'll adapt your plan to it.","Выберите цель — мы подстроим план под неё."),
      options:PURPOSES.map(p=>p[0]),
      optionLabel:(v)=>purposeLabel(v),
      onPick:(val)=>{ d.purpose=val; state.authStep=0.4; render(); },
      onBack:()=>{ state.authStep=0; render(); }
    });
  }
  if(step===0.4){
    return AuthChoiceStep({
      title:T("Avval IELTS topshirganmisiz?","Have you taken IELTS before?","Вы раньше сдавали IELTS?"),
      sub:T("Bu rejani to'g'ri tuzishga yordam beradi.","This helps us build the right plan.","Это поможет составить правильный план."),
      options:['yes','no'],
      optionLabel:(v)=> v==='yes' ? T("Ha, topshirganman","Yes, I have","Да, сдавал(а)") : T("Yo'q, topshirmaganman","No, I haven't","Нет, не сдавал(а)"),
      onPick:(val)=>{ d.hadIelts=(val==='yes'); state.authStep=0.6; render(); },
      onBack:()=>{ state.authStep=0.2; render(); }
    });
  }
  if(step===0.6){
    const took = !!d.hadIelts;
    return AuthChoiceStep({
      title: took ? T("IELTS dan nechi ball olgansiz?","What band did you get in IELTS?","Какой балл вы получили на IELTS?") : T("Hozir bilimingiz taxminan qancha?","What is your approximate level now?","Каков ваш примерный уровень сейчас?"),
      sub: took ? T("Oxirgi umumiy band ballingizni tanlang.","Choose your latest overall band score.","Выберите последний общий балл (band).") : T("Taxminiy darajangizni tanlang (3 dan 7.5 gacha).","Choose your approximate level (3 to 7.5).","Выберите примерный уровень (от 3 до 7.5)."),
      options: took ? [4,4.5,5,5.5,6,6.5,7,7.5,8,8.5,9] : [3,3.5,4,4.5,5,5.5,6,6.5,7,7.5],
      optionLabel:(v)=>'Band '+v,
      onPick:(val)=>{ d.prevScore=val; d.currentBand=val; state.authStep=1; render(); },
      onBack:()=>{ state.authStep=0.4; render(); }
    });
  }
  if(step===1){
    return AuthChoiceStep({
      title:"Sizga qaysi IELTS bali kerak?",
      sub:"Maqsad qilgan umumiy band ballingizni tanlang.",
      options:[5.5,6,6.5,7,7.5,8],
      optionLabel:(v)=>'Band '+v,
      onPick:(val)=>{ d.targetBand=val; state.authStep=3; render(); },
      onBack:()=>{ state.authStep=0.6; render(); }
    });
  }
  if(step===2){
    return AuthChoiceStep({
      title:"Hozirgi natijangiz qanday?",
      sub:"Taxminiy yoki oxirgi test natijangizni tanlang.",
      options:[4,4.5,5,5.5,6,6.5,7],
      optionLabel:(v)=>'Band '+v,
      onPick:(val)=>{ d.currentBand=val; state.authStep=3; render(); },
      onBack:()=>{ state.authStep=1; render(); }
    });
  }
  if(step===3){
    return AuthChoiceStep({
      title:"Kuniga necha soat shug'ullana olasiz?",
      sub:"Shunga qarab sizga kunlik reja tuzib beramiz.",
      options:[1,2,3,4],
      optionLabel:(v)=>v+' soat',
      onPick:(val)=>{ d.dailyHours=val; state.authStep=4; render(); },
      onBack:()=>{ state.authStep=1; render(); }
    });
  }
  if(step===4){
    return AuthChoiceStep({
      title:"Imtihoningiz qachon?",
      sub:"Imtihongacha qancha vaqt qolganini tanlang.",
      options:[1,2,3,4,5,6],
      optionLabel:(v)=>v+' oydan keyin',
      onPick:(val)=>{ d.examMonths=val; state.authStep=5; render(); },
      onBack:()=>{ state.authStep=3; render(); }
    });
  }
  if(step===5){
    return AuthChoiceStep({
      title:"Sizning zaif tomoningiz nima?",
      sub:"Qaysi ko'nikmada ko'proq qiynalasiz? Rejangizda shunga ko'proq vaqt ajratamiz.",
      options:['reading','listening','writing','speaking'],
      optionLabel:(v)=>SKILL_LABEL_UZ[v],
      onPick:(val)=>{
        d.weakSkill=val;
        state.authStep=5.5;
        render();
        generateAIPlan(d.currentBand, d.targetBand, d.dailyHours, d.examMonths, d.weakSkill).then(plan=>{
          d.planVerdict = plan.verdict;
          d.phase1Days = plan.phase1Days; d.phase2Days = plan.phase2Days; d.phase3Days = plan.phase3Days;
          d.phase1Tasks = plan.phase1Tasks; d.phase2Tasks = plan.phase2Tasks; d.phase3Tasks = plan.phase3Tasks;
          state.authStep=6;
          render();
        });
      },
      onBack:()=>{ state.authStep=4; render(); }
    });
  }
  if(step===5.5){
    return el(`
      <div class="auth-wrap">
        <div class="auth-card" style="max-width:420px;text-align:center;">
          <div class="auth-logo">IELTS</div>
          <div class="thinking" style="justify-content:center;margin-top:18px;"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <p class="auth-sub" style="margin-top:12px;">AI sizning shaxsiy rejangizni tuzmoqda...</p>
        </div>
      </div>
    `);
  }
  if(step===6){
    const totalDays = Math.max(14, Math.round(d.examMonths*30));
    let day1Task = '';
    try{
      const p0 = buildDayPlan({ dailyHours:d.dailyHours, weakSkill:d.weakSkill, examMonths:d.examMonths, phase1Days:d.phase1Days, phase2Days:d.phase2Days }, 0);
      day1Task = p0.blocks.map(b=>b.icon+' '+b.name+' — '+b.minutes+' daq').join(' · ');
    }catch(e){ day1Task = (d.phase1Tasks && d.phase1Tasks[0]) || ''; }
    let calendarHtml = '';
    for(let i=1;i<=totalDays;i++){
      calendarHtml += `<div style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;${i===1 ? 'background:linear-gradient(120deg,var(--accent-a),var(--accent-b));color:#0a0d1d;' : 'background:rgba(255,255,255,0.05);color:var(--ink-soft);border:1px solid var(--line);'}">${i===1 ? '1' : '🔒'}</div>`;
    }
    const wrap = el(`
      <div class="auth-wrap">
        <div class="auth-card" style="max-width:520px;">
          <div class="auth-logo">IELTS</div>
          <h2 style="margin:6px 0 2px;font-size:18px;">Sizning shaxsiy rejangiz tayyor</h2>
          <p class="auth-sub">Maqsad: Band ${d.targetBand} · Hozirgi: Band ${d.currentBand} · Kuniga ${d.dailyHours} soat · Imtihon: ${d.examMonths} oydan keyin · Zaif tomon: ${SKILL_LABEL_UZ[d.weakSkill]}</p>
          <div class="card" style="padding:14px 16px;margin:12px 0 10px;background:var(--paper);">
            <div style="font-size:13px;line-height:1.6;">${escapeHtml(d.planVerdict||'')}</div>
          </div>
          <div class="card" style="padding:14px 16px;margin:0 0 14px;background:linear-gradient(120deg, rgba(124,108,255,0.18), rgba(63,203,255,0.14));">
            <div style="font-size:11px;font-weight:800;color:var(--accent-b);">📌 1-KUN REJASI</div>
            <div style="font-size:14px;font-weight:700;margin-top:4px;">${escapeHtml(day1Task)}</div>
          </div>
          <div class="card" style="padding:14px 16px;margin:0 0 14px;">
            <div style="font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;">${totalDays} KUNLIK KALENDAR — har kuni birgina yangi kun ochiladi</div>
            <div style="display:flex;flex-wrap:wrap;gap:5px;max-height:140px;overflow-y:auto;">${calendarHtml}</div>
          </div>
          <button class="btn btn-primary" id="f-start" style="width:100%;justify-content:center;">Boshlash</button>
        </div>
      </div>
    `);
    wrap.querySelector('#f-start').onclick=()=>{
      finalizeAuth({
        familiya:d.familiya, ism:d.ism, phone:d.phone, isAdmin:d.isAdmin, lang:state.lang,
        purpose:d.purpose, hadIelts:d.hadIelts, prevScore:d.prevScore,
        targetBand:d.targetBand, currentBand:d.currentBand, dailyHours:d.dailyHours,
        examMonths:d.examMonths, weakSkill:d.weakSkill, planVerdict:d.planVerdict,
        phase1Days:d.phase1Days, phase2Days:d.phase2Days, phase3Days:d.phase3Days,
        phase1Tasks:d.phase1Tasks, phase2Tasks:d.phase2Tasks, phase3Tasks:d.phase3Tasks
      });
    };
    return wrap;
  }

  if(state.authAdminMode) return AdminLoginStep();
  // step 0 — personal info
  const wrap = el(`
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">IELTS</div>
        <p class="auth-sub">Shaxsiy tayyorgarlik maydonchangiz. Davom etish uchun ma'lumotlaringizni kiriting.</p>
        <div class="field"><label>Familiya</label><input type="text" id="f-familiya" placeholder="Familiya" value="${escapeHtml(d.familiya)}"></div>
        <div class="field"><label>Ism</label><input type="text" id="f-ism" placeholder="Ism" value="${escapeHtml(d.ism)}"></div>
        <div class="field"><label>Telefon raqam</label><input type="tel" id="f-phone" placeholder="Telefon raqam" value="${escapeHtml(d.phone)}"></div>
        <button class="btn btn-primary" id="f-submit" style="width:100%;justify-content:center;margin-top:6px;">Davom etish</button>
        <div class="err" id="f-err" style="display:none;"></div>
        <div style="text-align:center;margin-top:16px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;"><a href="#" id="f-lang" style="font-size:12px;color:var(--ink-soft);text-decoration:underline;">🌐 Tilni o'zgartirish</a></div>
      </div>
    </div>
  `);
  wrap.querySelector('#f-lang').onclick=(e)=>{ e.preventDefault(); setLang(null); };
  wrap.querySelector('#f-submit').onclick=()=>{
    const familiya = wrap.querySelector('#f-familiya').value.trim();
    const ism = wrap.querySelector('#f-ism').value.trim();
    const phone = wrap.querySelector('#f-phone').value.trim();
    const errEl = wrap.querySelector('#f-err');
    if(!familiya || !ism || !phone){
      errEl.textContent='Iltimos, barcha maydonlarni to\'ldiring.'; errEl.style.display='block'; return;
    }
    d.familiya=familiya; d.ism=ism; d.phone=phone;
    d.isAdmin = false;   // admin faqat Supabase Auth paroli orqali tasdiqlanadi
    if(isAdminIdentity(familiya, ism, phone)){ state.authAdminMode=true; render(); return; }
    state.authStep=0.2;
    render();
  };
  return wrap;
}

function AdminLoginStep(){
  const wrap = el(`
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">IELTS</div>
        <p class="auth-sub">PIN kodni kiriting</p>
        <div class="field"><label>PIN kod</label><input type="password" id="a-pin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••"></div>
        <button class="btn btn-primary" id="a-submit" style="width:100%;justify-content:center;margin-top:6px;">Kirish</button>
        <div class="err" id="a-err" style="display:none;"></div>
        <button class="backlink" id="a-back" style="margin:14px 0 0;">← Orqaga</button>
      </div>
    </div>
  `);
  const errEl = wrap.querySelector('#a-err');
  const showErr = m=>{ errEl.textContent=m; errEl.style.display='block'; };
  wrap.querySelector('#a-back').onclick=()=>{ state.authAdminMode=false; render(); };
  const submit = wrap.querySelector('#a-submit');
  const FK = 'ielts_pin_fail';
  const getFail = ()=>{ try{ return JSON.parse(localStorage.getItem(FK)||'{}'); }catch(e){ return {}; } };
  const go = async ()=>{
    const pin = wrap.querySelector('#a-pin').value.trim();
    if(!/^\d{4,12}$/.test(pin)){ showErr("PIN kodni kiriting (kamida 4 ta raqam)."); return; }
    const f = getFail();
    if(f.until && Date.now() < f.until){ showErr("Juda ko'p urinish. 15 daqiqadan keyin qayta urinib ko'ring."); return; }
    if(pin !== ADMIN_PIN){
