      modal.appendChild(el(`<div class="card" style="padding:14px 16px;text-align:center;color:var(--ok);font-weight:700;margin-bottom:12px;">✓ ${T("To'lov tasdiqlandi! Mock ochishga tayyor (bir martalik).","Payment approved! The mock is ready to open (one-time).","Оплата подтверждена! Мок готов к открытию (одноразово).")}</div>`));
      const openBtn = el(`<button class="btn btn-primary" style="width:100%;justify-content:center;">${T("Mockni ochish","Open the mock","Открыть мок")}</button>`);
      openBtn.onclick=()=>{
        const pend = state.mockPending;
        state.mockPayOpen=false; state.mockPaySent=false; state.mockPending=null;
        if(pend){
          if(pend.full){ pend.go(); }
          else { openMockGated(pend.key, pend.go); }
        }
        render();
      };
      modal.appendChild(openBtn);
    } else {
      modal.appendChild(el(`<div class="card" style="padding:14px 16px;text-align:center;color:var(--ok);font-weight:700;">✓ ${T("Chek yuborildi. Admin tasdiqlashini kuting — tasdiqlangach shu yerda \"Mockni ochish\" tugmasi chiqadi.","Receipt sent. Wait for the admin — an \"Open the mock\" button will appear here once approved.","Чек отправлен. Дождитесь админа — после подтверждения здесь появится кнопка «Открыть мок».")}</div>`));
    }
    return (scrim.appendChild(modal), scrim);
  }
  modal.appendChild(el(`
    <div class="field">
      <label>${T("To'lov chekini yuklang (rasm)","Upload your payment receipt (image)","Загрузите чек об оплате (изображение)")}</label>
      <input type="file" id="mock-receipt" accept="image/*">
    </div>
  `));
  const submitBtn = el(`<button class="btn btn-primary" style="width:100%;justify-content:center;">${T("Chekni yuborish","Submit receipt","Отправить чек")}</button>`);
  submitBtn.onclick=async ()=>{
    const fi = modal.querySelector('#mock-receipt');
    if(!fi.files || !fi.files[0]){ toast(T('Chek rasmini tanlang','Choose the receipt image','Выберите изображение чека')); return; }
    submitBtn.disabled=true; submitBtn.textContent='...';
    const ok = await submitPaymentReceipt({ somAmount:MOCK_PRICE, coins:0, isVip:false }, fi.files[0]);
    if(ok){ state.mockPaySent = true; toast(T("Chek yuborildi — admin tasdiqlagach mock ochiladi","Receipt sent — the mock opens once the admin approves","Чек отправлен — мок откроется после подтверждения админом")); render(); }
    else { submitBtn.disabled=false; submitBtn.textContent=T("Chekni yuborish","Submit receipt","Отправить чек"); toast(T('Yuborishda xatolik: ','Error sending: ','Ошибка отправки: ')+(state.lastError||'')); }
  };
  modal.appendChild(submitBtn);
  scrim.appendChild(modal);
  return scrim;
}

function AddExerciseModal(){
  const scrim = el(`<div class="modal-scrim"></div>`);
  scrim.onclick=(e)=>{ if(e.target===scrim && !submitBtn.disabled){ state.modalOpen=false; render(); } };

  const m = state.modalStep;
  const modal = document.createElement('div');
  modal.className='modal';

  const closeBtn = el(`<button class="modal-close">✕</button>`);
  closeBtn.onclick=()=>{ if(!submitBtn.disabled){ state.modalOpen=false; render(); } };
  modal.appendChild(closeBtn);
  modal.appendChild(el(`<div style="display:contents"><h2>Yangi mashq qo'shish</h2><p class="sub">Barcha foydalanuvchilarga ko'rinadi. Faqat siz qo'sha olasiz.</p></div>`));

  modal.appendChild(el(`<label>Bo'lim</label>`));
  const segSection = el(`<div class="seg" style="margin-bottom:14px;"></div>`);
  [['reading','Reading'],['listening','Listening'],['dictation','Diktant'],['writing','Writing'],['speaking','Speaking'],['reading_mock','Reading mock'],['full_mock',"To'liq mock"],['speaking_full',"Speaking to'liq"]].forEach(([val,label])=>{
    const b = el(`<button type="button" class="${m.section===val?'on':''}">${label}</button>`);
    b.onclick=()=>{
      m.section=val;
      if(val==='reading') m.subtype='passage1';
      else if(val==='writing') m.subtype='task1';
      else if(val==='speaking') m.subtype='part1';
      else m.subtype=null;
      render();
    };
    segSection.appendChild(b);
  });
  modal.appendChild(segSection);

  if(m.section==='reading_mock' || m.section==='full_mock'){
    modal.appendChild(el(`<div class="empty" style="padding:10px 12px;margin-bottom:14px;font-size:12.5px;">${m.section==='reading_mock' ? "Bitta HTML fayl to'liq Reading mock sifatida yuklanadi va Reading bo'limidagi \"Mock testlar\" ro'yxatiga qo'shiladi." : "Bitta HTML fayl to'liq mock sifatida yuklanadi va \"Mock testlar\" bo'limiga qo'shiladi."}</div>`));
  }
  if(m.section==='speaking_full'){
    modal.appendChild(el(`<div class="empty" style="padding:10px 12px;margin-bottom:14px;font-size:12.5px;">Part 1, Part 2 va Part 3 savollarini birga kiritasiz — bitta to'liq Speaking test sifatida saqlanadi.</div>`));
  }

  if(m.section==='reading' || m.section==='writing' || m.section==='speaking'){
    const opts = m.section==='reading' ? [['passage1','Passage 1'],['passage2','Passage 2'],['passage3','Passage 3']]
      : m.section==='writing' ? [['task1','Task 1'],['task2','Task 2']]
      : [['part1','Part 1'],['part2','Part 2'],['part3','Part 3']];
    modal.appendChild(el(`<label>${m.section==='reading'?'Passage':m.section==='writing'?'Task':'Part'}</label>`));
    const seg2 = el(`<div class="seg" style="margin-bottom:14px;"></div>`);
    opts.forEach(([val,label])=>{
      const b = el(`<button type="button" class="${m.subtype===val?'on':''}">${label}</button>`);
      b.onclick=()=>{ m.subtype=val; render(); };
      seg2.appendChild(b);
    });
    modal.appendChild(seg2);
  }

  const isSpeaking = (m.section==='speaking' || m.section==='speaking_full');
  const isWriting = m.section==='writing';
  if(m.section==='speaking'){
    modal.appendChild(el(`
      <div class="field">
        <label>Mavzu nomi *</label>
        <input type="text" id="sp-title" placeholder="masalan: Hometown, Describe a book, Technology...">
      </div>
    `));
    if(m.subtype==='part2'){
      modal.appendChild(el(`
        <div class="field">
          <label>Part 2 savollari (cue card) — hammasi bitta joyga</label>
          <textarea id="sp-q-text" rows="7" placeholder="Describe a book you have recently read.&#10;You should say:&#10;- what it was&#10;- who wrote it&#10;- why you read it&#10;and explain how you felt about it."></textarea>
        </div>
      `));
    } else {
      const qWrap = el(`<div class="field"><label>Savollar (${SUBTYPE_LABEL[m.subtype]||'Part'}) — ixtiyoriy, kerakli sonini qo'shing</label><div id="sp-qlist"></div></div>`);
      const qList = qWrap.querySelector('#sp-qlist');
      const addRow = (focus)=>{
        const n = qList.children.length + 1;
        const row = el(`<div class="sp-qrow"><input type="text" class="sp-q-row" placeholder="${n}-savol"><button type="button" class="btn btn-ghost btn-sm" title="O'chirish">✕</button></div>`);
        row.querySelector('button').onclick=()=>{
          if(qList.children.length<=1){ row.querySelector('input').value=''; return; }
          row.remove();
          Array.from(qList.children).forEach((r,i)=>{ r.querySelector('input').placeholder=(i+1)+'-savol'; });
        };
        qList.appendChild(row);
        if(focus) row.querySelector('input').focus();
      };
      addRow(false);
      const addBtn = el(`<button type="button" class="btn btn-ghost btn-sm" style="margin-top:4px;">+ Savol qo'shish</button>`);
      addBtn.onclick=()=>addRow(true);
      qWrap.appendChild(addBtn);
      modal.appendChild(qWrap);
    }
  } else if(m.section==='speaking_full'){
    modal.appendChild(el(`
      <div style="display:contents">
      <div class="field"><label>Test nomi</label><input type="text" id="ex-title" placeholder="masalan: Full Speaking Test 1"></div>
      <div class="field"><label>Part 1 savoli</label><textarea id="sp-q1" rows="2" placeholder="Part 1 savoli"></textarea></div>
      <div class="field"><label>Part 2 savoli (cue card)</label><textarea id="sp-q2" rows="3" placeholder="Part 2 savoli"></textarea></div>
      <div class="field"><label>Part 3 savoli</label><textarea id="sp-q3" rows="2" placeholder="Part 3 savoli"></textarea></div>
      </div>
    `));
  } else if(isWriting){
    modal.appendChild(el(`
      <div style="display:contents">
      <div class="field"><label>Sarlavha</label><input type="text" id="ex-title" placeholder="masalan: Cambridge 17 Test 2 Task 1"></div>
      <div class="field"><label>Mavzu matni (savol)</label><textarea id="wr-prompt-text" rows="4" placeholder="Task matnini shu yerga yozing..."></textarea></div>
      ${m.subtype==='task1' ? `
      <div class="field">
        <label>Diagramma/grafik rasmi (ixtiyoriy, Task 1 uchun)</label>
        <input type="file" id="ex-file" accept="image/*">
      </div>
      ` : ''}
      </div>
    `));
  }

  if(m.section==='dictation'){
    modal.appendChild(el(`
      <div style="display:contents">
      <div class="empty" style="padding:10px 12px;margin-bottom:14px;font-size:12.5px;">Diktant alohida bo'lim: audio yuklanadi, script esa matn sifatida yoziladi. Foydalanuvchi scriptni ko'rmaydi — faqat o'zi yozganini tekshiradi.</div>
      <div class="field"><label>Sarlavha</label><input type="text" id="dc-title" placeholder="masalan: Diktant 1 — City tour"></div>
      <div class="field">
        <label>Audio fayl</label>
        <input type="file" id="dc-audio" accept="audio/*,video/*">
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;">mp3, wav, m4a va h.k., 45 MB gacha. Davomiyligi istalgancha bo'lishi mumkin.</div>
      </div>
      <div class="field"><label>Script (audioning to'liq matni)</label><textarea id="dc-script" rows="8" placeholder="Audioning to'g'ri matnini shu yerga yozing yoki joylang..."></textarea></div>
      </div>
    `));
  }

  if(!isSpeaking && !isWriting && m.section!=='dictation') modal.appendChild(el(`
    <div style="display:contents">
    <div class="field">
      <label>Sarlavha</label>
      <input type="text" id="ex-title" placeholder="masalan: Cambridge 17 Test 2 Passage 1">
    </div>
    <div class="field">
      <label>Fayl (HTML, PDF, rasm yoki boshqa)</label>
      <input type="file" id="ex-file" multiple accept=".html,.htm,text/html,application/pdf,image/*,video/*,audio/*">
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;">HTML faylni shu yerga yuklang. Agar audio alohida fayl bo'lsa, uni HTML bilan birga tanlang (Ctrl/Shift bosib bir nechta fayl) — HTML ichidagi audio nomi avtomatik ulanadi. Natija ham mashq tugagach o'zi aniqlanadi.</div>
    </div>
    ${m.section==='listening' ? `
    <div class="field">
      <label>Audio fayl</label>
      <input type="file" id="ex-audio-fix" accept="audio/*,video/*">
      <div style="font-size:11.5px;color:var(--ink-soft);margin-top:5px;">Istalgan formatdagi audio (mp3, wav, m4a va h.k.) to'g'ridan-to'g'ri qabul qilinadi, 45 MB gacha. HTML ichidagi audio manzili avtomatik shu bilan almashtiriladi; agar HTML faylida audio allaqachon ishlayotgan bo'lsa, bo'sh qoldiring.</div>
    </div>
    ` : ''}
    </div>
  `));

  if(m.section!=='writing' && m.section!=='full_mock' && m.section!=='dictation' && !isSpeaking){
    modal.appendChild(el(`
      <div class="field">
        <label>Jami savollar soni (ixtiyoriy)</label>
        <input type="number" id="ex-total" placeholder="masalan 40">
      </div>
    `));
  }

  const submitBtn = el(`<button class="btn btn-primary" style="width:100%;justify-content:center;">Qo'shish</button>`);
  modal.appendChild(submitBtn);

  async function resolveListeningAudioAsset(){
    // "Audio fayl" maydonini o'qib yuklaydi — Supabase Storage istalgan audio/video
    // formatini qabul qiladi (mp3, wav, m4a, mp4, webm va h.k.).
    const fixInput = modal.querySelector('#ex-audio-fix');
    if(!fixInput || !fixInput.files || !fixInput.files[0]) return null;
    const audioFile = fixInput.files[0];
    if(!isStorableAudioType(audioFile)){
      toast("Bu fayl audio/video formatida emasga o'xshaydi — boshqa fayl tanlang.");
      return 'WRONG_TYPE';
    }
    if(audioFile.size > 45*1024*1024){
      toast('Audio fayl 45 MB dan katta — birozroq siqib, qayta yuklang.');
      return 'WRONG_TYPE';
    }
    submitBtn.textContent = 'Yuklanmoqda...';
    return await uploadFile(audioFile, {type: audioFile.type || 'audio/mpeg'});
  }

  submitBtn.onclick=async ()=>{
    if(m.section==='dictation'){
      const dcTitle = modal.querySelector('#dc-title').value.trim();
      const dcScript = modal.querySelector('#dc-script').value.trim();
      const dcFile = modal.querySelector('#dc-audio').files && modal.querySelector('#dc-audio').files[0];
      if(!dcTitle){ toast('Sarlavhani kiriting'); return; }
      if(!dcFile){ toast('Audio faylni tanlang'); return; }
      if(!dcScript){ toast('Script matnini kiriting'); return; }
      if(!isStorableAudioType(dcFile)){ toast("Bu fayl audio/video formatida emasga o'xshaydi — boshqa fayl tanlang."); return; }
      if(dcFile.size > 45*1024*1024){ toast('Audio fayl 45 MB dan katta — birozroq siqib, qayta yuklang.'); return; }
      submitBtn.disabled=true; submitBtn.textContent='Audio yuklanmoqda...';
      const up = await uploadFile(dcFile, {type: dcFile.type || 'audio/mpeg'});
      if(!up){ submitBtn.disabled=false; submitBtn.textContent="Qo'shish"; return; }
      submitBtn.textContent='Saqlanmoqda...';
      const okDc = await addExercise({ section:'dictation', subtype:null, title:dcTitle, promptText:dcScript, assetId:up.id, assetUrl:up.url, assetType:up.contentType, contentKind:null, totalQuestions:null });
      submitBtn.disabled=false; submitBtn.textContent="Qo'shish";
      if(!okDc) return;
      state.modalOpen=false;
      toast('Diktant qo\'shildi');
      render();
      return;
    }
    if(m.section==='speaking'){
      const spTitle = modal.querySelector('#sp-title').value.trim();
      if(!spTitle){ toast('Mavzu nomini kiriting'); return; }
      let text;
      if(m.subtype==='part2'){
        text = modal.querySelector('#sp-q-text').value.trim();
      } else {
        text = Array.from(modal.querySelectorAll('.sp-q-row')).map(i=>i.value.trim()).filter(Boolean).join('\n');
      }
      if(!text){ toast(m.subtype==='part2' ? 'Savol matnini kiriting' : 'Kamida bitta savol kiriting'); return; }
      submitBtn.disabled=true; submitBtn.textContent='Saqlanmoqda...';
      const okSp = await addSpeakingQuestion(text, m.subtype, {groupTitle:spTitle});
      submitBtn.disabled=false; submitBtn.textContent="Qo'shish";
      if(!okSp) return;
      state.modalOpen=false;
      toast('Speaking savoli qo\'shildi');
      render();
      return;
    }
    if(m.section==='speaking_full'){
      const title = modal.querySelector('#ex-title').value.trim();
      const q1 = modal.querySelector('#sp-q1').value.trim();
      const q2 = modal.querySelector('#sp-q2').value.trim();
      const q3 = modal.querySelector('#sp-q3').value.trim();
      if(!title || !q1 || !q2 || !q3){ toast('Barcha maydonlarni to\'ldiring'); return; }
      submitBtn.disabled=true; submitBtn.textContent='Saqlanmoqda...';
      const groupId = uid();
      await addSpeakingQuestion(q1, 'part1', {groupId, groupTitle:title});
      await addSpeakingQuestion(q2, 'part2', {groupId, groupTitle:title});
      await addSpeakingQuestion(q3, 'part3', {groupId, groupTitle:title});
      state.modalOpen=false;
      submitBtn.disabled=false; submitBtn.textContent="Qo'shish";
      toast("To'liq Speaking test qo'shildi");
      render();
      return;
    }
    if(m.section==='writing'){
      const title = modal.querySelector('#ex-title').value.trim();
      const promptText = modal.querySelector('#wr-prompt-text').value.trim();
      if(!title || !promptText){ toast("Sarlavha va mavzu matnini kiriting"); return; }
      submitBtn.disabled=true; submitBtn.textContent='Saqlanmoqda...';
      let assetId=null, assetUrl=null, assetType=null;
      const imgInput = modal.querySelector('#ex-file');
      if(imgInput && imgInput.files && imgInput.files[0]){
        submitBtn.textContent='Rasm yuklanmoqda...';
        const res = await storeTaskImage(imgInput.files[0]);
        if(res){ assetId=res.id; assetUrl=res.url; assetType=res.contentType; }
        else { submitBtn.disabled=false; submitBtn.textContent="Qo'shish"; toast('Rasmni o\'qib bo\'lmadi — JPG yoki PNG formatida yuklang. Mashq saqlanmadi.'); return; }
        submitBtn.textContent='Saqlanmoqda...';
      }
      const okEx = await addExercise({ section:'writing', subtype:m.subtype, title, promptText, assetId, assetUrl, assetType, contentKind:null, totalQuestions:null });
      if(!okEx){ submitBtn.disabled=false; submitBtn.textContent="Qo'shish"; return; }
      state.modalOpen=false;
      submitBtn.disabled=false; submitBtn.textContent="Qo'shish";
      toast('Writing mashqi qo\'shildi');
      render();
      return;
    }
    const title = modal.querySelector('#ex-title').value.trim();
    if(!title){ toast('Sarlavha kiriting'); return; }
    const isMockUpload = (m.section==='reading_mock' || m.section==='full_mock');
    const fileInput = modal.querySelector('#ex-file');
    if(isMockUpload && !(fileInput.files && fileInput.files[0])){ toast('Fayl tanlang'); return; }
    submitBtn.disabled=true; submitBtn.textContent='Yuklanmoqda...';
    try{
      let assetId=null, assetUrl=null, assetType=null, contentKind=null;
      if(fileInput.files && fileInput.files[0]){
        const allFiles = Array.from(fileInput.files);
        const f = allFiles.find(x=>x.type==='text/html' || /\.html?$/i.test(x.name)) || allFiles[0];
        const extraMedia = allFiles.filter(x=>x!==f && isStorableAudioType(x));
        const isHtml = f.type==='text/html' || /\.html?$/i.test(f.name);
        if(isHtml){
          let text = await f.text();
          if(extraMedia.length){ submitBtn.textContent = 'Audio yuklanmoqda...'; text = await rewriteMediaRefs(text, extraMedia); }
          if(m.section==='listening'){
            const audioRes = await resolveListeningAudioAsset();
            if(audioRes==='WRONG_TYPE'){ submitBtn.disabled=false; submitBtn.textContent="Qo'shish"; return; }
            if(audioRes){
              const oldSrc = extractAudioSrcFromHtml(text);
              if(oldSrc){
                text = text.split(oldSrc).join(audioRes.url);
              } else if(/<audio\b[^>]*>/i.test(text)){
                text = text.replace(/<audio\b([^>]*)>/i, (full, attrs)=>{
                  return /\ssrc=/i.test(attrs) ? full : `<audio${attrs} src="${audioRes.url}">`;
                });
              }
            } else {
              const fixInput = modal.querySelector('#ex-audio-fix');
              if(fixInput && fixInput.files && fixInput.files[0]){
                toast('Audio saqlanmadi — mashq audiosiz saqlanadi, keyinroq qayta urinib ko\'ring');
              }
            }
          }
          const leftover = findRelativeMediaRefs(text);
          if(leftover.length){ toast("⚠️ HTML ichida audio fayl nomi qoldi ("+leftover[0]+") — audio ulanmadi. Audio faylni HTML bilan birga tanlab qayta yuklang."); }
          const htmlBlob = new Blob([text], {type:'text/plain'});
          const res = await uploadFile(htmlBlob, {type:'text/plain'});
          if(res){ assetId=res.id; assetUrl=res.url; assetType=res.contentType; contentKind='html'; }
          else { return; }
        } else {
          const res = await uploadFile(f);
          if(res){ assetId=res.id; assetUrl=res.url; assetType=res.contentType; }
          else { return; }
        }
      } else if(m.section==='listening'){
        // Asosiy fayl tanlanmagan — faqat "Audio fayl" to'ldirilgan bo'lishi mumkin.
        // Bu holda audioning o'zi mashqning asosiy fayli sifatida ishlatiladi.
        const audioRes = await resolveListeningAudioAsset();
        if(audioRes==='WRONG_TYPE'){ submitBtn.disabled=false; submitBtn.textContent="Qo'shish"; return; }
        if(audioRes){ assetId=audioRes.id; assetUrl=audioRes.url; assetType=audioRes.contentType; }
      }
      const totalEl = modal.querySelector('#ex-total');
      const total = totalEl ? (parseInt(totalEl.value)||null) : null;
      if(isMockUpload){
        await addDirectMock({
          section: m.section==='reading_mock' ? 'reading' : 'full',
          title, assetId, assetUrl, assetType, contentKind, totalQuestions: total
        });
        toast(m.section==='reading_mock' ? "Reading mock qo'shildi" : "To'liq mock qo'shildi");
      } else {
        await addExercise({
          section:m.section, subtype:m.subtype, title, assetId, assetUrl, assetType, contentKind, totalQuestions: total
        });
        toast('Mashq qo\'shildi');
      }
      state.modalOpen=false;
    }catch(err){
      toast('Xatolik yuz berdi: ' + ((err && err.message) ? err.message : 'saqlab bo\'lmadi') + ' — qayta urinib ko\'ring');
    }finally{
      submitBtn.disabled=false; submitBtn.textContent="Qo'shish";
      render();
    }
  };

  scrim.appendChild(modal);
  return scrim;
}

/* ============ GO ============ */
boot();
</script>
</body>
</html>
